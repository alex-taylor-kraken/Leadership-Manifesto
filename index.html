    const LangContext = createContext("en");
    const useLang = () => { const code = useContext(LangContext); return (key) => T[code]?.[key] ?? T.en[key] ?? key; };

    // ─── Colour utilities ─────────────────────────────────────────────────────

    function hexToRgb(hex) {
      return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
    }
    function darken(hex, amount=40) {
      let [r,g,b] = hexToRgb(hex);
      r=Math.max(0,r-amount); g=Math.max(0,g-amount); b=Math.max(0,b-amount);
      return `#${r.toString(16).padStart(2,"0")}${g.toString(16).padStart(2,"0")}${b.toString(16).padStart(2,"0")}`;
    }
    function extractColours(imgEl, count=10) {
      const canvas=document.createElement("canvas"); canvas.width=120; canvas.height=120;
      const ctx=canvas.getContext("2d"); ctx.drawImage(imgEl,0,0,120,120);
      const data=ctx.getImageData(0,0,120,120).data;
      const pixels=[];
      for (let i=0;i<data.length;i+=4) {
        const r=data[i],g=data[i+1],b=data[i+2],a=data[i+3];
        if (a<128) continue;
        const max=Math.max(r,g,b),min=Math.min(r,g,b);
        const sat=max===0?0:(max-min)/max, light=(max+min)/510;
        if (sat>0.15&&light>0.08&&light<0.92) pixels.push([r,g,b]);
      }
      const clusters=[],threshold=55;
      pixels.forEach(p=>{
        let nearest=-1,nearestDist=Infinity;
        clusters.forEach((c,i)=>{ const d=Math.sqrt((p[0]-c.r)**2+(p[1]-c.g)**2+(p[2]-c.b)**2); if(d<nearestDist){nearestDist=d;nearest=i;} });
        if (nearest>=0&&nearestDist<threshold) { const c=clusters[nearest]; c.r=(c.r*c.count+p[0])/(c.count+1); c.g=(c.g*c.count+p[1])/(c.count+1); c.b=(c.b*c.count+p[2])/(c.count+1); c.count++; }
        else clusters.push({r:p[0],g:p[1],b:p[2],count:1});
      });
      clusters.sort((a,b)=>b.count-a.count);
      return clusters.slice(0,count).map(c=>`#${Math.round(c.r).toString(16).padStart(2,"0")}${Math.round(c.g).toString(16).padStart(2,"0")}${Math.round(c.b).toString(16).padStart(2,"0")}`);
    }

    // ─── CSV Parser ───────────────────────────────────────────────────────────

    function parseCSV(text) {
      const lines=text.trim().split("\n"); if (lines.length<2) return [];
      const rows=[];
      for (let i=1;i<lines.length;i++) {
        const cols=[]; let cur="",inQ=false;
        for (const ch of lines[i]) { if(ch==='"'){inQ=!inQ;} else if(ch===','&&!inQ){cols.push(cur.trim());cur="";} else{cur+=ch;} }
        cols.push(cur.trim());
        if (cols.length>=5) rows.push({session:cols[1]?.trim()||"",q1:parseFloat(cols[2])||null,q2:parseFloat(cols[3])||null,q3:cols[4]?.trim()||""});
      }
      return rows.filter(r=>r.session);
    }

    function avgScores(rows,keys,mapping) {
      const out={};
      keys.forEach(area=>{
        const rel=rows.filter(r=>(mapping[r.session.toLowerCase()]||[]).includes(area));
        const q1s=rel.map(r=>r.q1).filter(Boolean), q2s=rel.map(r=>r.q2).filter(Boolean);
        out[area]={q1Avg:q1s.length?q1s.reduce((a,b)=>a+b,0)/q1s.length:null, q2Avg:q2s.length?q2s.reduce((a,b)=>a+b,0)/q2s.length:null, count:rel.length};
      });
      return out;
    }

    // ─── Q3 theme clustering ──────────────────────────────────────────────────
    // Groups responses by shared keywords/themes and returns the top N clusters.
    // Each cluster has a label (the most representative phrase) and the responses

    const THEME_SEEDS = [
      { label: "Psychological safety & open communication", keywords: ["safe","safety","speak","voice","honest","open","listen","trust","fear","psycholog"] },
      { label: "Empowerment & autonomy", keywords: ["empower","autonomy","autonomous","own","ownership","trust people","delegate","freedom"] },
      { label: "Clarity of vision & purpose", keywords: ["vision","purpose","clarity","clear","direction","why","narrative","north star","goal"] },

      { label: "Agility & adaptability", keywords: ["agil","adapt","change","flex","pivot","learn","growth","evolve","experiment","fail"] },
      { label: "Inclusive & visible leadership", keywords: ["inclus","diverse","visible","present","show up","model","example","lead by"] },
      { label: "Decision-making & courage", keywords: ["decid","decision","courage","bold","brave","difficult","challenge","risk","stand"] },
      { label: "Wellbeing & human-centred", keywords: ["wellbeing","well-being","human","people first","care","compassion","support","thrive"] },
      { label: "Innovation & learning culture", keywords: ["innovat","learn","curious","experiment","idea","creative","test","improve","develop"] },
    ];

    function clusterResponses(responses) {
      const scored = responses.map(r => {
        const lower = r.toLowerCase();
        const matches = THEME_SEEDS.map((seed, idx) => ({
          idx,
          score: seed.keywords.filter(kw => lower.includes(kw)).length,
        })).filter(m => m.score > 0).sort((a,b) => b.score - a.score);
        return { text: r, topSeed: matches[0]?.idx ?? -1 };
      });

      const buckets = {};
      scored.forEach(({ text, topSeed }) => {
        const key = topSeed === -1 ? "__other__" : topSeed;
        if (!buckets[key]) buckets[key] = [];
        buckets[key].push(text);
      });

      const clusters = Object.entries(buckets)
        .filter(([k]) => k !== "__other__")
        .map(([k, texts]) => ({ label: THEME_SEEDS[Number(k)].label, texts, count: texts.length }))
        .sort((a,b) => b.count - a.count)
        .slice(0, 6);

      return clusters;
    }

    // Build a 1–2 sentence description of a cluster from its actual responses.
    // Strategy: extract the most distinctive noun phrases / verb phrases from the
    // texts and weave them into a readable summary sentence.
    function describeCluster(texts) {
      if (texts.length === 0) return "";

      // Score each response for how principle-like it is
      const score = t => {
        let s = t.trim().split(/\s+/).length * 0.5;
        if (/^[A-Z]/.test(t)) s += 2;
        if (!t.endsWith("?")) s += 1;
        if (/\b(that|where|who|so that|in order|through|by)\b/i.test(t)) s += 3;
        if (/\b(must|should|need to|commit|ensure|always|never|every|create|build|foster|enable)\b/i.test(t)) s += 2;
        return s;
      };

      const sorted = [...texts].sort((a,b) => score(b) - score(a));
      const anchor = sorted[0];
      const rest = sorted.slice(1);

      if (texts.length === 1) {
        return `"${anchor.charAt(0).toUpperCase() + anchor.slice(1).replace(/\.?\s*$/,".")}"`;
      }

      // Extract the single clearest action from each remaining response.
      // Strategy: find the first verb phrase — look for action verbs followed by their object.
      // If the whole response is short enough (≤10 words), just use it directly as a quote fragment.
      const actionVerbs = /\b(create|build|foster|enable|ensure|commit|hold|lead|listen|speak|trust|challenge|support|empower|develop|drive|embrace|encourage|establish|maintain|model|own|prioritise|prioritize|promote|protect|reward|share|show|stand|take|treat|uphold|value|welcome)\b/i;

      const extractAction = t => {
        t = t.trim().replace(/\.?\s*$/, "");
        const words = t.split(/\s+/);
        // Short response — use as-is (lowercase, no quotes — will be embedded in a list)
        if (words.length <= 9) return t.charAt(0).toLowerCase() + t.slice(1);
        // Longer — find the first action verb and take up to 8 words from there
        const lower = t.toLowerCase();
        const match = lower.match(actionVerbs);
        if (match) {
          const idx = lower.indexOf(match[0]);
          // Find character position → word position
          const before = t.substring(0, idx).split(/\s+/).filter(Boolean).length;
          const slice = words.slice(before, before + 8).join(" ");
          return slice.charAt(0).toLowerCase() + slice.slice(1).replace(/\.?\s*$/, "");
        }
        // Fallback — first 8 words
        return words.slice(0,8).join(" ").replace(/\.?\s*$/,"").toLowerCase();
      };

      // Deduplicate actions and filter anything that closely echoes the anchor
      const anchorLower = anchor.toLowerCase();
      const actions = [];
      rest.forEach(t => {
        const a = extractAction(t);
        // Require at least 3 words to avoid stub fragments
        if (a && a.split(/\s+/).length >= 3 && !anchorLower.includes(a.substring(0,15))) {
          actions.push(a);
        }
      });

      const uniqueActions = [...new Set(actions)].slice(0, 4);

      return `"${anchor.charAt(0).toUpperCase() + anchor.slice(1).replace(/\.?\s*$/,".")}"`;

    }

    // ─── PPTX parser ─────────────────────────────────────────────────────────
    // Reads a .pptx (zip) file, extracts text from each slide, then attempts
    // to detect "Day N" headings and assign sessions to days.

    async function parsePptxDayMap(file) {
      const zip = await JSZip.loadAsync(file);

      // Get slide files in order
      const slideFiles = Object.keys(zip.files)
        .filter(n => n.match(/^ppt\/slides\/slide\d+\.xml$/))
        .sort((a,b) => {
          const na = parseInt(a.match(/\d+/)[0]);
          const nb = parseInt(b.match(/\d+/)[0]);
          return na - nb;
        });

      // Extract all text from a slide XML
      const slideTexts = await Promise.all(slideFiles.map(async name => {
        const xml = await zip.files[name].async("text");
        const matches = xml.match(/<a:t[^>]*>([^<]+)<\/a:t>/g) || [];
        return matches.map(m => m.replace(/<[^>]+>/g,"").trim()).filter(Boolean);
      }));

      // Known session titles (lowercase) for matching
      const knownSessions = Object.keys(SESSION_TO_SIX);

      // Build day map by scanning slides for "Day N" markers
      const dayMap = {};
      let currentDay = null;

      slideTexts.forEach(texts => {
        const fullText = texts.join(" ").toLowerCase();
        const slideStr = texts.join("\n");

        // Detect day header — look for "day 1", "day 2" etc anywhere on slide
        const dayMatch = fullText.match(/\bday\s*(\d+)\b/);
        if (dayMatch) {
          currentDay = `Day ${dayMatch[1]}`;
          if (!dayMap[currentDay]) dayMap[currentDay] = [];
        }

        if (currentDay) {
          // Try to match any known session title appearing in this slide's text
          knownSessions.forEach(session => {
            const sessionWords = session.replace(/[()\/]/g," ").split(/\s+/).filter(w=>w.length>3);
            const matchCount = sessionWords.filter(w => fullText.includes(w)).length;
            const threshold = Math.max(2, Math.floor(sessionWords.length * 0.5));
            if (matchCount >= threshold && !dayMap[currentDay].includes(session)) {
              dayMap[currentDay].push(session);
            }
          });
        }
      });

      // Also try: if no day headers found, look for explicit agenda/schedule slide patterns
      if (Object.keys(dayMap).length === 0) {
        // Fall back: group consecutive sessions by position into days
        const allFound = [];
        slideTexts.forEach(texts => {
          const fullText = texts.join(" ").toLowerCase();
          knownSessions.forEach(session => {
            const sessionWords = session.replace(/[()\/]/g," ").split(/\s+/).filter(w=>w.length>3);
            const matchCount = sessionWords.filter(w => fullText.includes(w)).length;
            if (matchCount >= Math.max(2, Math.floor(sessionWords.length * 0.5))) {
              if (!allFound.includes(session)) allFound.push(session);
            }
          });
        });
        // Split evenly across 4 days
        const perDay = Math.ceil(allFound.length / 4);
        for (let d=0; d<4; d++) {
          dayMap[`Day ${d+1}`] = allFound.slice(d*perDay, (d+1)*perDay);
        }
      }

      return dayMap;
    }

              )}
              {activeTab==="wheel" && (
                <>
                  <p style={{color:theme.textSub,fontSize:13,marginBottom:16}}>{t("scoresDescWheel")}</p>
                  <WheelView scores={compScores}/>
                </>
              )}
            </>
          )}
          {activeSection==="q3" && <Q3Panel rows={filteredRows}/>}
          {activeSection==="sessions" && <SessionBreakdown rows={filteredRows}/>}
        </div>
      );
    }

    // ─── Programme Setup ──────────────────────────────────────────────────────

    function ProgrammeSetup({dayMap, setDayMap}) {
      const theme = useTheme();
      const [parsing, setParsing] = useState(false);
      const [parseError, setParseError] = useState("");
      const [dragging, setDragging] = useState(false);
      const [dragSession, setDragSession] = useState(null);
      const [dragFromDay, setDragFromDay] = useState(null);

      const days = Object.keys(dayMap);
      const hasMap = days.length > 0;

      const handleDeckFile = async (file) => {
        if (!file) return;
        if (!file.name.endsWith(".pptx") && !file.name.endsWith(".ppt")) {
          setParseError("Please upload a .pptx file."); return;
        }
        setParsing(true); setParseError("");
        try {
          const map = await parsePptxDayMap(file);
          const nonEmpty = Object.values(map).some(d => d.length > 0);
          if (!nonEmpty) setParseError("Couldn't auto-detect sessions from the deck. Assign them manually below.");
          setDayMap(map);
        } catch(e) {
          setParseError("Failed to read the deck. Make sure it's a valid .pptx file.");
        }
        setParsing(false);
      };

      const onSessionDragStart = (session, fromDay) => { setDragSession(session); setDragFromDay(fromDay); };
      const onDayDrop = (toDay) => {
        if (!dragSession || dragFromDay === toDay) { setDragSession(null); return; }
        setDayMap(prev => {
          const next = {};
          Object.entries(prev).forEach(([day, sessions]) => {
            next[day] = day === dragFromDay
              ? sessions.filter(s => s !== dragSession)
              : day === toDay ? [...sessions, dragSession] : [...sessions];
          });
          return next;
        });
        setDragSession(null); setDragFromDay(null);
      };

      const addDay = () => {
        const n = days.length + 1;
        setDayMap(prev => ({...prev, [`Day ${n}`]: []}));
      };

      const removeDay = (day) => {
        setDayMap(prev => { const next={...prev}; delete next[day]; return next; });
      };

      const assignedSessions = new Set(Object.values(dayMap).flat().map(s => s.toLowerCase()));
      const unassigned = Object.keys(SESSION_TO_SIX).filter(s => !assignedSessions.has(s.toLowerCase()));

      return (
        <div>
          <p style={{color:theme.textSub,fontSize:14,marginBottom:24}}>
            Upload your programme deck to automatically detect which sessions run on which day, then fine-tune manually.
            Once set up, day filter pills will appear on the Scores by Area view.
          </p>

          {/* Deck upload */}
          <div
            onDragOver={e=>{e.preventDefault();setDragging(true);}}
            onDragLeave={()=>setDragging(false)}
            onDrop={e=>{e.preventDefault();setDragging(false);handleDeckFile(e.dataTransfer.files[0]);}}
            style={{border:`2px dashed ${dragging?theme.primary:theme.border}`,borderRadius:12,padding:"28px 24px",textAlign:"center",background:dragging?`${theme.primary}22`:theme.bgDeep,marginBottom:28,transition:"all 0.2s"}}
          >
            <div style={{fontSize:36,marginBottom:10}}>📑</div>
            <p style={{color:theme.textBody,fontWeight:600,marginBottom:6}}>{hasMap?"Replace programme deck":"Upload your programme deck"}</p>
            <p style={{color:theme.textMuted,fontSize:13,marginBottom:16}}>Drop a .pptx file — sessions will be detected and mapped to days automatically</p>
            {parsing ? (
              <div style={{color:theme.primary,fontWeight:600}}>Reading deck…</div>
            ) : (
              <label style={{background:`linear-gradient(135deg,${theme.primary},${theme.primaryDark})`,color:theme.btnText,padding:"10px 24px",borderRadius:8,cursor:"pointer",fontWeight:700,fontSize:14}}>
                Choose .pptx file
                <input type="file" accept=".pptx,.ppt" onChange={e=>handleDeckFile(e.target.files[0])} style={{display:"none"}}/>
              </label>
            )}
            {parseError&&<p style={{color:theme.secondary,marginTop:12,fontSize:13}}>{parseError}</p>}
          </div>

          {/* Day map editor */}
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,flexWrap:"wrap",gap:10}}>
            <h3 style={{color:theme.textBody,fontSize:16}}>Session to Day Mapping</h3>
            <button onClick={addDay} style={{background:"none",border:`1px solid ${theme.border}`,color:theme.textSub,padding:"7px 14px",borderRadius:8,cursor:"pointer",fontSize:13}}>+ Add day</button>
          </div>
          <p style={{color:theme.textMuted,fontSize:13,marginBottom:16}}>Drag sessions between day columns to assign them. Unassigned sessions appear below.</p>

          <div style={{display:"grid",gridTemplateColumns:`repeat(${Math.min(Math.max(days.length,1),4)},1fr)`,gap:12,marginBottom:24}}>
            {days.map(day=>(
              <div key={day}
                onDragOver={e=>e.preventDefault()}
                onDrop={()=>onDayDrop(day)}
                style={{background:theme.bgCard,border:`2px dashed ${dragSession&&dragFromDay!==day?theme.primary:theme.border}`,borderRadius:12,padding:14,minHeight:140}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                  <div style={{color:theme.primary,fontWeight:700,fontSize:14}}>{day}</div>
                  <button onClick={()=>removeDay(day)} title="Remove day" style={{background:"none",border:"none",color:theme.textMuted,cursor:"pointer",fontSize:16,padding:0,lineHeight:1}}>✕</button>
                </div>
                {(dayMap[day]||[]).length===0&&<p style={{color:theme.textMuted,fontSize:12}}>Drop sessions here</p>}
                {(dayMap[day]||[]).map(s=>(
                  <div key={s} draggable onDragStart={()=>onSessionDragStart(s,day)}
                    style={{background:theme.bgDeep,border:`1px solid ${theme.border}`,borderRadius:6,padding:"6px 10px",marginBottom:6,fontSize:12,color:theme.textSub,cursor:"grab",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <span>{s}</span><span style={{color:theme.textMuted,fontSize:10}}>⠿</span>
                  </div>
                ))}
              </div>
            ))}
            {days.length===0&&(
              <div style={{background:theme.bgCard,border:`1px dashed ${theme.border}`,borderRadius:12,padding:24,textAlign:"center",color:theme.textMuted,fontSize:13,gridColumn:"1/-1"}}>
                Upload a deck above or click "+ Add day" to start building the day map manually.
              </div>
            )}
          </div>

          {/* Unassigned sessions */}
          {unassigned.length>0&&(
            <Card>
              <h4 style={{color:theme.textMuted,fontSize:12,textTransform:"uppercase",letterSpacing:1,marginBottom:12}}>Unassigned sessions — drag to a day column above</h4>
              <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
                {unassigned.map(s=>(
                  <div key={s} draggable onDragStart={()=>onSessionDragStart(s,"__unassigned__")}
                    style={{background:theme.bgDeep,border:`1px solid ${theme.border}`,borderRadius:6,padding:"6px 12px",fontSize:12,color:"#ccc",cursor:"grab",display:"flex",alignItems:"center",gap:6}}>
                    <span style={{color:theme.textMuted,fontSize:10}}>⠿</span>{s}
                  </div>
                ))}
              </div>
            </Card>
          )}
        </div>
      );
    }

    // ─── QR Code modal ────────────────────────────────────────────────────────

    const FORM_BASE_URL = "https://alex-taylor-kraken.github.io/Leadership-Manifesto/form.html";

    function buildFormUrl(client, cohort, month, year) {
      const p = new URLSearchParams();
      if (client) p.set("client", client);
      if (cohort) p.set("cohort", cohort);
      if (month)  p.set("month",  month);
      if (year)   p.set("year",   year);
      return `${FORM_BASE_URL}?${p.toString()}`;
    }

    function QRModal({cohort, onClose}) {
      const theme = useTheme();
      const qrRef = useRef(null);
      const url = buildFormUrl(cohort.client, cohort.cohort, cohort.month, cohort.year);

      useEffect(() => {
        if (!qrRef.current) return;
        qrRef.current.innerHTML = "";
        new QRCode(qrRef.current, {
          text: url,
          width: 240,
          height: 240,
          colorDark: "#29172E",
          colorLight: "#F5ECE2",
          correctLevel: QRCode.CorrectLevel.H,
        });
      }, [url]);

      return (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.7)",zIndex:2000,display:"flex",alignItems:"center",justifyContent:"center",padding:24}} onClick={onClose}>
          <div style={{background:theme.bgCard,border:`1px solid ${theme.border}`,borderRadius:20,padding:32,maxWidth:380,width:"100%",textAlign:"center"}} onClick={e=>e.stopPropagation()}>
            <h2 style={{color:theme.textBody,fontSize:18,fontWeight:800,marginBottom:4}}>{cohort.client}</h2>
            <p style={{color:theme.textMuted,fontSize:13,marginBottom:20}}>{cohort.cohort} · {cohort.month} {cohort.year}</p>

            {/* QR code */}
            <div style={{display:"inline-block",background:"#F5ECE2",borderRadius:12,padding:12,marginBottom:16}}>
              <div ref={qrRef}/>
            </div>

            <p style={{color:theme.textMuted,fontSize:12,marginBottom:20,lineHeight:1.6}}>
              Participants scan this to open their response form. The client, cohort, month and year are pre-filled automatically.
            </p>

            {/* Copyable URL */}
            <div style={{background:theme.bgDeep,border:`1px solid ${theme.border}`,borderRadius:8,padding:"8px 12px",marginBottom:20,textAlign:"left"}}>
              <p style={{color:theme.textMuted,fontSize:10,textTransform:"uppercase",letterSpacing:1,marginBottom:4}}>Form URL</p>
              <p style={{color:theme.textSub,fontSize:11,wordBreak:"break-all",lineHeight:1.5}}>{url}</p>
            </div>

            <div style={{display:"flex",gap:10}}>
              <button
                onClick={()=>{navigator.clipboard.writeText(url);}}
                style={{flex:1,padding:"10px",background:theme.bgDeep,border:`1px solid ${theme.border}`,color:theme.textSub,borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:600}}>
                Copy link
              </button>
              <button
                onClick={onClose}
                style={{flex:1,padding:"10px",background:`linear-gradient(135deg,${theme.primary},${theme.primaryDark})`,border:"none",color:"#fff",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:700}}>
                Done
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ─── Cohort Manager ───────────────────────────────────────────────────────

    const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
    const YEARS=Array.from({length:10},(_,i)=>(new Date().getFullYear()-5+i).toString());

    function CohortManager({cohorts,setCohorts,dayMap}) {
      const theme=useTheme();
      const [pending,setPending]=useState({client:"",cohort:"",month:"",year:"",rows:[],fileName:""});
      const [addError,setAddError]=useState("");
      const [activeCohortId,setActiveCohortId]=useState(null);
      const [compareMode,setCompareMode]=useState(false);
      const [qrCohort,setQrCohort]=useState(null);
      const [editingId,setEditingId]=useState(null);

      const handleCSV=(file)=>{
        if (!file) return;
        const reader=new FileReader();
        reader.onload=(e)=>{
          try {
            const parsed=parseCSV(e.target.result);
            if (parsed.length===0){setAddError("No data rows found. Please check your CSV format.");return;}
            setPending(p=>({...p,rows:parsed,fileName:file.name}));
            setAddError("");
          } catch {setAddError("Failed to parse CSV.");}
        };
        reader.readAsText(file);
      };

      const addCohort=()=>{
        if (!pending.client.trim()){setAddError("Please enter a client name.");return;}
        if (!pending.cohort.trim()){setAddError("Please enter a cohort name.");return;}
        if (!pending.month){setAddError("Please select a month.");return;}
        if (!pending.year){setAddError("Please select a year.");return;}
        if (pending.rows.length===0){setAddError("Please upload a CSV file.");return;}
        const newId=Date.now().toString();
        const newCohort={id:newId,...pending};
        setCohorts(c=>[...c,newCohort]);
        setActiveCohortId(newId);
        setPending({client:"",cohort:"",month:"",year:"",rows:[],fileName:""});
        setAddError("");
        setCompareMode(false);
      };

      const removeCohort=(id)=>{
        setCohorts(c=>c.filter(c=>c.id!==id));
        if (activeCohortId===id) setActiveCohortId(cohorts.filter(c=>c.id!==id)[0]?.id||null);
      };

      const updateLabel=(id,field,value)=>{
        setCohorts(cs=>cs.map(c=>c.id===id?{...c,[field]:value}:c));
      };

      const activeCohort=cohorts.find(c=>c.id===activeCohortId);

      // For compare: merge all cohort rows
      const allRows=cohorts.flatMap(c=>c.rows);

      const inputStyle={width:"100%",marginTop:4};
      const fieldStyle={flex:1,minWidth:120};

      return (
        <div>
          {/* Add cohort form */}
          <Card style={{marginBottom:20,borderColor:theme.primary,borderWidth:1.5}}>
            <h3 style={{color:theme.primary,marginBottom:16,fontSize:15}}>+ Add a cohort</h3>
            <div style={{display:"flex",gap:12,flexWrap:"wrap",marginBottom:12}}>
              <div style={fieldStyle}>
                <label style={{color:theme.textSub,fontSize:12}}>Client name *</label>
                <input type="text" placeholder="e.g. TTE UK" value={pending.client} onChange={e=>setPending(p=>({...p,client:e.target.value}))} style={inputStyle}/>
              </div>
              <div style={fieldStyle}>
                <label style={{color:theme.textSub,fontSize:12}}>Cohort name *</label>
                <input type="text" placeholder="e.g. Cohort A" value={pending.cohort} onChange={e=>setPending(p=>({...p,cohort:e.target.value}))} style={inputStyle}/>
              </div>
              <div style={{flex:"0 0 130px"}}>
                <label style={{color:theme.textSub,fontSize:12}}>Month *</label>
                <select value={pending.month} onChange={e=>setPending(p=>({...p,month:e.target.value}))} style={{...inputStyle}}>
                  <option value="">Month</option>
                  {MONTHS.map(m=><option key={m} value={m}>{m}</option>)}
                </select>
              </div>
              <div style={{flex:"0 0 100px"}}>
                <label style={{color:theme.textSub,fontSize:12}}>Year *</label>
                <select value={pending.year} onChange={e=>setPending(p=>({...p,year:e.target.value}))} style={{...inputStyle}}>
                  <option value="">Year</option>
                  {YEARS.map(y=><option key={y} value={y}>{y}</option>)}
                </select>
              </div>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
              <label style={{background:theme.bgDeep,border:`1px dashed ${pending.rows.length>0?theme.strong:theme.border}`,borderRadius:8,padding:"8px 16px",cursor:"pointer",fontSize:13,color:pending.rows.length>0?theme.strong:theme.textSub,display:"flex",alignItems:"center",gap:8}}>
                {pending.rows.length>0 ? `✓ ${pending.fileName} (${pending.rows.length} rows)` : "📂 Upload CSV"}
                <input type="file" accept=".csv" onChange={e=>handleCSV(e.target.files[0])} style={{display:"none"}}/>
              </label>
              <button onClick={addCohort} style={{background:`linear-gradient(135deg,${theme.primary},${theme.primaryDark})`,color:"#fff",border:"none",padding:"9px 20px",borderRadius:8,cursor:"pointer",fontWeight:700,fontSize:14}}>
                Add cohort
              </button>
            </div>
            {addError&&<p style={{color:theme.secondary,fontSize:13,marginTop:10}}>{addError}</p>}
          </Card>

          {cohorts.length===0&&(
            <div style={{textAlign:"center",padding:"48px 24px",color:theme.textMuted}}>
              <div style={{fontSize:40,marginBottom:12}}>📋</div>
              <p>No cohorts added yet. Fill in the form above to add your first one.</p>
            </div>
          )}

          {cohorts.length>0&&(
            <>
              {/* Cohort pill selector */}
              <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:20,alignItems:"center"}}>
                {cohorts.map(c=>(
                  <div key={c.id} style={{display:"flex",alignItems:"center",gap:0}}>
                    {editingId===c.id ? (
                      <div style={{background:theme.bgCard,border:`2px solid ${theme.primary}`,borderRadius:10,padding:"6px 10px",display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
                        <input type="text" value={c.client} onChange={e=>updateLabel(c.id,"client",e.target.value)} style={{width:110}} placeholder="Client"/>
                        <input type="text" value={c.cohort} onChange={e=>updateLabel(c.id,"cohort",e.target.value)} style={{width:90}} placeholder="Cohort"/>
                        <select value={c.month} onChange={e=>updateLabel(c.id,"month",e.target.value)} style={{width:110}}>
                          {MONTHS.map(m=><option key={m} value={m}>{m}</option>)}
                        </select>
                        <select value={c.year} onChange={e=>updateLabel(c.id,"year",e.target.value)} style={{width:80}}>
                          {YEARS.map(y=><option key={y} value={y}>{y}</option>)}
                        </select>
                        <button onClick={()=>setEditingId(null)} style={{background:theme.strong,border:"none",color:"#fff",borderRadius:6,padding:"4px 10px",cursor:"pointer",fontSize:12,fontWeight:700}}>Done</button>
                      </div>
                    ) : (
                      <button
                        onClick={()=>{ setActiveCohortId(c.id); setCompareMode(false); }}
                        style={{
                          padding:"8px 14px",borderRadius:"8px 0 0 8px",border:`1px solid ${activeCohortId===c.id&&!compareMode?theme.primary:theme.border}`,
                          background:activeCohortId===c.id&&!compareMode?`${theme.primary}22`:theme.bgCard,
                          color:activeCohortId===c.id&&!compareMode?theme.primary:"#ccc",
                          cursor:"pointer",fontWeight:600,fontSize:13,
                        }}>
                        <span style={{opacity:0.7,fontSize:11}}>{c.client} · {c.cohort}</span>
                        <br/>
                        <span style={{fontSize:12}}>{c.month} {c.year}</span>
                      </button>
                    )}
                    {editingId!==c.id&&(
                      <div style={{display:"flex",flexDirection:"column",borderLeft:"none"}}>
                        <button onClick={()=>setQrCohort(c)} title="Show QR code" style={{background:theme.bgDeep,border:`1px solid ${theme.border}`,borderLeft:"none",borderBottom:"none",color:theme.primary,padding:"4px 8px",cursor:"pointer",fontSize:11,borderRadius:"0 6px 0 0"}}>⬡</button>
                        <button onClick={()=>setEditingId(c.id)} title="Edit labels" style={{background:theme.bgDeep,border:`1px solid ${theme.border}`,borderLeft:"none",borderBottom:"none",color:theme.textMuted,padding:"4px 8px",cursor:"pointer",fontSize:11,borderRadius:"0"}}>✎</button>
                        <button onClick={()=>removeCohort(c.id)} title="Remove" style={{background:theme.bgDeep,border:`1px solid ${theme.border}`,borderLeft:"none",color:"#ff4d6d",padding:"4px 8px",cursor:"pointer",fontSize:11,borderRadius:"0 0 6px 0"}}>✕</button>
                      </div>
                    )}
                  </div>
                ))}
                {cohorts.length>1&&(
                  <button
                    onClick={()=>setCompareMode(true)}
                    style={{padding:"8px 16px",borderRadius:8,border:`1px solid ${compareMode?theme.primary:theme.border}`,background:compareMode?`${theme.primary}22`:theme.bgDeep,color:compareMode?theme.primary:theme.textSub,cursor:"pointer",fontWeight:600,fontSize:13}}>
                    ⇄ Compare all
                  </button>
                )}
              </div>

              {/* Active cohort label */}
              {!compareMode&&activeCohort&&(
                <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:20,padding:"10px 16px",background:theme.bgCard,borderRadius:10,border:`1px solid ${theme.border}`}}>
                  <div style={{width:8,height:8,borderRadius:"50%",background:theme.primary}}/>
                  <div>
                    <span style={{color:theme.textBody,fontWeight:700}}>{activeCohort.client}</span>
                    <span style={{color:theme.textMuted,marginLeft:8}}>·</span>
                    <span style={{color:theme.textSub,marginLeft:8}}>{activeCohort.cohort}</span>
                    <span style={{color:theme.textMuted,marginLeft:8}}>·</span>
                    <span style={{color:theme.textSub,marginLeft:8}}>{activeCohort.month} {activeCohort.year}</span>
                  </div>
                  <div style={{marginLeft:"auto",color:theme.textMuted,fontSize:13}}>{activeCohort.rows.length} responses</div>
                </div>
              )}

              {compareMode&&(
                <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:20,padding:"10px 16px",background:`${theme.primary}11`,borderRadius:10,border:`1px solid ${theme.primary}`}}>
                  <div style={{width:8,height:8,borderRadius:"50%",background:theme.primary}}/>
                  <span style={{color:theme.primary,fontWeight:700}}>Comparing all {cohorts.length} cohorts</span>
                  <span style={{color:theme.textMuted,fontSize:13,marginLeft:8}}>— {allRows.length} total responses across {cohorts.map(c=>`${c.client} ${c.cohort} (${c.month} ${c.year})`).join(", ")}</span>
                </div>
              )}

              {/* Analysis */}
              {!compareMode&&activeCohort&&<AnalysisView rows={activeCohort.rows} clientName={activeCohort.client} dayMap={dayMap}/>}
              {compareMode&&<AnalysisView rows={allRows} clientName={cohorts.map(c=>c.client).filter((v,i,a)=>a.indexOf(v)===i).join(" & ")} dayMap={dayMap}/>}
            </>
          )}
          {qrCohort&&<QRModal cohort={qrCohort} onClose={()=>setQrCohort(null)}/>}
        </div>
      );
    }

    // ─── Branding Panel ───────────────────────────────────────────────────────

    const COLOUR_GROUPS = [
      {
        label: "Brand & Accent",
        keys: [
          { key:"primary",     label:"Primary accent (buttons, active tabs)" },
          { key:"primaryDark", label:"Primary dark (button hover, gradients)" },
        ]
      },
      {
        label: "Score Colours",
        keys: [
          { key:"strong",     label:"Strong (7–10)" },
          { key:"developing", label:"Developing (4–6)" },
          { key:"secondary",  label:"Emerging (1–3)" },
        ]
      },
      {
        label: "Backgrounds",
        keys: [
          { key:"bgMain",  label:"Page background" },
          { key:"bgCard",  label:"Card & panel background" },
          { key:"navBg",   label:"Navigation bar background" },
          { key:"bgDeep",  label:"Recessed areas (upload zones, tab bars)" },
          { key:"bgTrack", label:"Score bar track" },
          { key:"bgHover", label:"Hover state" },
        ]
      },
      {
        label: "Borders",
        keys: [
          { key:"border", label:"Default border" },
        ]
      },
      {
        label: "Text",
        keys: [
          { key:"textBody",  label:"Primary body text" },
          { key:"textSub",   label:"Secondary text" },
          { key:"textMuted", label:"De-emphasised / label text" },
        ]
      },
      {
        label: "Buttons",
        keys: [
          { key:"btnText",    label:"Primary button text" },
          { key:"btnSecBg",   label:"Secondary button background" },
          { key:"btnSecText", label:"Secondary button text" },
        ]
      },
    ];

    function BrandingPanel({theme,onThemeChange,onClose}) {
      const [extracted,setExtracted]=useState([]);
      const [paletteImg,setPaletteImg]=useState(null);
      const [dragging,setDragging]=useState(false);
      const [selectedRole,setSelectedRole]=useState("primary");
      const [openGroup,setOpenGroup]=useState(null);

      // Auto-assign extracted colours to theme slots based on their visual properties
      const autoAssignTheme=(colours,currentTheme)=>{
        if(!colours||colours.length===0) return currentTheme;

        // Compute properties for each colour
        const analysed=colours.map(hex=>{
          const [r,g,b]=hexToRgb(hex);
          const max=Math.max(r,g,b), min=Math.min(r,g,b);
          const lightness=(max+min)/510;                      // 0-1
          const saturation=max===0?0:(max-min)/max;          // 0-1
          const chroma=max-min;                              // 0-255
          // Hue
          let hue=0;
          if(chroma>0){
            if(max===r) hue=((g-b)/chroma)%6;
            else if(max===g) hue=(b-r)/chroma+2;
            else hue=(r-g)/chroma+4;
            hue=Math.round(hue*60); if(hue<0) hue+=360;
          }
          return {hex,r,g,b,lightness,saturation,chroma,hue};
        });

        // Sort helpers
        const byLight=(...arr)=>[...arr].sort((a,b)=>a.lightness-b.lightness);
        const bySat=(...arr)=>[...arr].sort((a,b)=>b.saturation-a.saturation);

        // Find the most vibrant / punchy colour → primary accent
        const vibrant=bySat(...analysed).find(c=>c.saturation>0.3&&c.lightness>0.2&&c.lightness<0.75)||analysed[0];

        // Find darkest colour → bgMain
        const darkest=byLight(...analysed)[0];

        // Find second-darkest for cards
        const secondDark=byLight(...analysed)[1]||darkest;

        // Find lightest colour → textBody (should contrast with dark bg)
        const lightest=byLight(...analysed)[analysed.length-1];

        // Find a mid-dark for bgDeep (darker than card, lighter than main)
        const midDark=byLight(...analysed).find(c=>c.lightness<darkest.lightness+0.15&&c.hex!==darkest.hex)||secondDark;

        // Find a secondary accent (second most vibrant, different hue from primary)
        const secondAccent=bySat(...analysed).find(c=>
          c.hex!==vibrant.hex&&
          Math.abs(c.hue-vibrant.hue)>30&&
          c.saturation>0.2
        )||vibrant;

        // Build border: slightly lighter than bgCard
        const borderHex=`#${Math.min(255,secondDark.r+30).toString(16).padStart(2,"0")}${Math.min(255,secondDark.g+30).toString(16).padStart(2,"0")}${Math.min(255,secondDark.b+30).toString(16).padStart(2,"0")}`;

        // Build muted text: blend between primary and light
        const mutedHex=`#${Math.round((vibrant.r+lightest.r*2)/3).toString(16).padStart(2,"0")}${Math.round((vibrant.g+lightest.g*2)/3).toString(16).padStart(2,"0")}${Math.round((vibrant.b+lightest.b*2)/3).toString(16).padStart(2,"0")}`;

        return {
          ...currentTheme,
          primary:     vibrant.hex,
          primaryDark: darken(vibrant.hex,45),
          bgMain:      darkest.hex,
          bgCard:      secondDark.hex,
          bgDeep:      midDark.hex,
          bgTrack:     darken(secondDark.hex,-15),
          bgHover:     darken(secondDark.hex,-25),
          navBg:       secondDark.hex,
          border:      borderHex,
          textBody:    lightest.hex,
          textSub:     darken(lightest.hex,-20),
          textMuted:   mutedHex,
          btnText:     lightest.hex,
          btnSecBg:    secondDark.hex,
          btnSecText:  lightest.hex,
        };
      };

      const handlePaletteFile=(file)=>{
        if (!file||!file.type.startsWith("image/")) return;
        const url=URL.createObjectURL(file); setPaletteImg(url);
        const img=new Image();
        img.onload=()=>{
          const colours=extractColours(img,12);
          setExtracted(colours);
          // Auto-apply theme based on extracted colours
          const newTheme=autoAssignTheme(colours,theme);
          onThemeChange(newTheme);
        };
        img.src=url;
      };

      const applyColour=(hex,key)=>{
        if(key==="primary") onThemeChange({...theme,primary:hex,primaryDark:darken(hex,50)});
        else onThemeChange({...theme,[key]:hex});
      };

      const Section=({label,children})=>(

      const ColourRow=({label,k})=>(

          </div>
        </div>

      return (
        <div style={{position:"fixed",top:0,right:0,bottom:0,width:380,background:theme.bgCard,borderLeft:`1px solid ${theme.border}`,zIndex:1000,overflowY:"auto",padding:24,boxShadow:"-8px 0 32px rgba(0,0,0,0.6)"}}>

          {/* Header */}
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
            <h2 style={{color:theme.textBody,fontSize:18,fontWeight:800}}>🎨 Branding</h2>
            <button onClick={onClose} style={{background:"none",border:"none",color:theme.textMuted,fontSize:22,cursor:"pointer"}}>✕</button>
          </div>

          {/* Preset themes */}
          <div style={{marginBottom:20}}>
            <p style={{color:theme.textMuted,fontSize:11,textTransform:"uppercase",letterSpacing:1,marginBottom:10}}>Presets</p>
            <div style={{display:"flex",gap:8}}>
              <button onClick={()=>onThemeChange(DEFAULT_THEME)} style={{flex:1,padding:"10px",borderRadius:8,border:`2px solid ${theme.primary}`,background:theme.bgDeep,color:theme.primary,cursor:"pointer",fontSize:13,fontWeight:700}}>
                🐙 Kraken Dark
              </button>
              <button onClick={()=>onThemeChange(LIGHT_THEME)} style={{flex:1,padding:"10px",borderRadius:8,border:`2px solid ${theme.border}`,background:"#F5ECE2",color:"#29172E",cursor:"pointer",fontSize:13,fontWeight:700}}>
                ☀️ Kraken Light
              </button>
            </div>
          </div>

          {/* Palette image upload */}
          <div
            onDragOver={e=>{e.preventDefault();setDragging(true);}}
            onDragLeave={()=>setDragging(false)}
            onDrop={e=>{e.preventDefault();setDragging(false);handlePaletteFile(e.dataTransfer.files[0]);}}
            style={{border:`2px dashed ${dragging?theme.primary:theme.border}`,borderRadius:12,padding:"16px",textAlign:"center",background:dragging?`${theme.primary}22`:theme.bgDeep,marginBottom:16,transition:"all 0.2s"}}>
            {paletteImg
              ? <img src={paletteImg} alt="palette" style={{maxWidth:"100%",maxHeight:80,borderRadius:8,marginBottom:8,display:"block",margin:"0 auto 8px"}}/>
              : <div style={{fontSize:28,marginBottom:6}}>🎨</div>
            }
            <p style={{color:theme.textMuted,fontSize:12,marginBottom:10}}>{paletteImg?"Replace palette — theme will update automatically":"Upload a brand colour palette — theme auto-applies instantly"}</p>
            <label style={{background:theme.primary,color:theme.btnText,padding:"7px 16px",borderRadius:7,cursor:"pointer",fontWeight:600,fontSize:13}}>
              Choose image<input type="file" accept="image/*" onChange={e=>handlePaletteFile(e.target.files[0])} style={{display:"none"}}/>
            </label>
          </div>

          {/* Extracted swatches with role selector */}
          {extracted.length>0&&(
            <div style={{marginBottom:20}}>

              <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:10}}>
                {extracted.map((hex,i)=>(
                  <div key={i} title={hex}

                      border:Object.values(theme).includes(hex)?"3px solid #fff":"2px solid transparent",
                      boxShadow:"0 2px 8px rgba(0,0,0,0.4)",transition:"transform 0.1s"}}
                    onClick={()=>applyColour(hex,selectedRole)}
                    onMouseEnter={e=>e.currentTarget.style.transform="scale(1.12)"}
                    onMouseLeave={e=>e.currentTarget.style.transform="scale(1)"}
                  />
                ))}
              </div>
              <p style={{color:theme.textMuted,fontSize:11}}>
                Applying to: <strong style={{color:theme.primary}}>{COLOUR_GROUPS.flatMap(g=>g.keys).find(k=>k.key===selectedRole)?.label||selectedRole}</strong>
                {" — "}open a section below and click "apply" next to any colour slot to change which one.
              </p>
            </div>
          )}

          {/* Full colour controls grouped by section */}
          <div style={{marginBottom:20}}>
            {COLOUR_GROUPS.map(({label,keys})=>(
              <Section key={label} label={label}>
                {keys.map(({key,label})=><ColourRow key={key} k={key} label={label}/>)}
              </Section>
            ))}
          </div>

        </div>
      );
    }

    // ─── Single CSV Upload ────────────────────────────────────────────────────

    function SingleUpload({rows,setRows,fileName,setFileName,error,setError,dayMap}) {
      const theme=useTheme();
      const [dragging,setDragging]=useState(false);
      const [clientName,setClientName]=useState("");
      const [editingClient,setEditingClient]=useState(false);

      const handleFile=(file)=>{
        if (!file) return;
        setFileName(file.name); setError("");
        const reader=new FileReader();
        reader.onload=(e)=>{ try { const parsed=parseCSV(e.target.result); if(parsed.length===0){setError("No data rows found.");} else setRows(parsed); } catch{setError("Failed to parse CSV.");} };
        reader.readAsText(file);
      };
      const onDrop=useCallback((e)=>{ e.preventDefault(); setDragging(false); handleFile(e.dataTransfer.files[0]); },[]);
      const sessions=[...new Set(rows.map(r=>r.session))];

      return rows.length===0 ? (
        <div onDragOver={e=>{e.preventDefault();setDragging(true);}} onDragLeave={()=>setDragging(false)} onDrop={onDrop}
          style={{border:`2px dashed ${dragging?theme.primary:theme.border}`,borderRadius:16,padding:"48px 32px",textAlign:"center",background:dragging?`${theme.primary}22`:theme.bgDeep,transition:"all 0.2s",marginBottom:24}}>
          <div style={{fontSize:48,marginBottom:16}}>📊</div>
          <h2 style={{marginBottom:8}}>Upload your CSV export</h2>
          <p style={{color:theme.textMuted,marginBottom:24,fontSize:14}}>Export from Google Forms, Typeform, or any questionnaire tool and drop it here</p>
          <label style={{background:`linear-gradient(135deg,${theme.primary},${theme.primaryDark})`,color:theme.btnText,padding:"12px 28px",borderRadius:8,cursor:"pointer",fontWeight:700,fontSize:15}}>
            Choose CSV file<input type="file" accept=".csv" onChange={e=>handleFile(e.target.files[0])} style={{display:"none"}}/>
          </label>
          {error&&<p style={{color:theme.secondary,marginTop:16}}>{error}</p>}
        </div>
      ) : (
        <>
          <div style={{display:"flex",gap:16,marginBottom:24,flexWrap:"wrap",alignItems:"center",justifyContent:"space-between"}}>
            <div style={{display:"flex",gap:12,flexWrap:"wrap",alignItems:"center"}}>
              {[{label:"Total responses",value:rows.length},{label:"Sessions covered",value:sessions.length}].map(({label,value})=>(
                <div key={label} style={{background:theme.bgCard,border:`1px solid ${theme.border}`,borderRadius:8,padding:"8px 16px"}}>
                  <div style={{color:theme.textMuted,fontSize:12}}>{label}</div>
                  <div style={{color:theme.primary,fontWeight:800,fontSize:22}}>{value}</div>
                </div>
              ))}
              <div style={{background:theme.bgCard,border:`1px solid ${theme.border}`,borderRadius:8,padding:"8px 16px"}}>
                <div style={{color:theme.textMuted,fontSize:12}}>File</div>
                <div style={{color:theme.textBody,fontWeight:600,fontSize:14}}>{fileName}</div>
              </div>
              {/* Client name prompt */}
              <div style={{background:clientName?theme.bgCard:`${theme.secondary}18`,border:`1px solid ${clientName?theme.border:theme.secondary}`,borderRadius:8,padding:"8px 16px",display:"flex",alignItems:"center",gap:10}}>
                <div>
                  <div style={{color:theme.textMuted,fontSize:12}}>Client name</div>
                  {editingClient ? (
                    <input
                      type="text"
                      autoFocus
                      value={clientName}
                      onChange={e=>setClientName(e.target.value)}
                      onBlur={()=>setEditingClient(false)}
                      onKeyDown={e=>{ if(e.key==="Enter"||e.key==="Escape") setEditingClient(false); }}
                      placeholder="e.g. TTE UK"
                      style={{background:"none",border:"none",borderBottom:`1px solid ${theme.primary}`,color:theme.textBody,fontSize:14,fontWeight:600,outline:"none",width:140,padding:"2px 0"}}
                    />
                  ) : (
                    <div
                      onClick={()=>setEditingClient(true)}
                      style={{color:clientName?"#fff":theme.secondary,fontWeight:600,fontSize:14,cursor:"pointer",minWidth:120}}
                    >
                      {clientName||"⚠ Add client name"}
                    </div>
                  )}
                </div>
                {!editingClient&&<button onClick={()=>setEditingClient(true)} style={{background:"none",border:"none",color:theme.textMuted,cursor:"pointer",fontSize:13,padding:0}}>✎</button>}
              </div>
            </div>
            <label style={{background:theme.bgCard,border:`1px solid ${theme.border}`,color:theme.textSub,padding:"8px 16px",borderRadius:8,cursor:"pointer",fontSize:13}}>
              Upload new CSV<input type="file" accept=".csv" onChange={e=>{setRows([]);handleFile(e.target.files[0]);}} style={{display:"none"}}/>
            </label>
          </div>
          <AnalysisView rows={rows} clientName={clientName} dayMap={dayMap}/>
        </>
      );
    }

    function downloadPdf(elementId, filename) {
      const el = document.getElementById(elementId);
      if (!el) return;
      const opt = {
        margin: [8, 8, 8, 8],
        filename: filename,
        image: { type: "jpeg", quality: 0.97 },
        html2canvas: { scale: 2, useCORS: true, backgroundColor: "#29172E" },
        jsPDF: { unit: "mm", format: "a4", orientation: "portrait" },
        pagebreak: { mode: ["avoid-all", "css", "legacy"] },
      };
      html2pdf().set(opt).from(el).save();
    }

      const inputBox = {width:"100%", marginTop:0};

      // Build the participant URL encoding setup + question text (no session — participant selects that)
      const buildUrl = () => {
        const p = new URLSearchParams();
        if (client) p.set("client", client);
        if (cohort) p.set("cohort", cohort);
        if (month)  p.set("month",  month);
        if (year)   p.set("year",   year);
        // Encode custom question text — replace [client] placeholder
        const resolve = t => t.replace(/\[client\]/gi, client || "this organisation");
        p.set("q1", resolve(q1Text));
        p.set("q2", resolve(q2Text));
        p.set("q3", resolve(q3Text));
        return `${FORM_BASE_URL}?${p.toString()}`;
      };

        if (missing) return;
        setQrGenerated(true); // triggers re-render, then useEffect draws the QR
      };

      // Draw the QR code once the ref div is in the DOM
      useEffect(() => {
        if (!qrGenerated || !qrRef.current) return;
        qrRef.current.innerHTML = "";
        new QRCode(qrRef.current, {
          text: buildUrl(),
          width: 260,
          height: 260,
          colorDark: "#29172E",
          colorLight: "#F5ECE2",
          correctLevel: QRCode.CorrectLevel.H,
        });
      }, [qrGenerated, client, cohort, month, year, q1Text, q2Text, q3Text]);

      const copyLink = () => {
        navigator.clipboard.writeText(buildUrl());

                      onClick={generateQR}
                      disabled={missing}
                      style={{width:"100%",padding:"12px",background:missing?"transparent":`linear-gradient(135deg,${theme.primary},${theme.primaryDark})`,border:missing?`1px solid ${theme.border}`:"none",borderRadius:10,color:missing?theme.textMuted:"#fff",fontSize:14,fontWeight:700,cursor:missing?"not-allowed":"pointer",opacity:missing?0.5:1}}>
                      Generate QR Code
                    </button>
                  </div>
                ) : (
                  <div>
                    <div style={{display:"inline-block",background:"#F5ECE2",borderRadius:12,padding:12,marginBottom:16}}>
                      <div ref={qrRef}/>
                    </div>
                    <p style={{color:theme.textMuted,fontSize:12,marginBottom:16,lineHeight:1.5}}>
                      Participants scan this. They'll see the questions — nothing else.
                    </p>
                    <div style={{display:"flex",gap:8,marginBottom:12}}>
                      <button onClick={copyLink} style={{flex:1,padding:"9px",background:theme.bgDeep,border:`1px solid ${theme.border}`,color:copied?theme.strong:theme.textSub,borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:600}}>
                        {copied ? "✓ Copied!" : "Copy link"}
                      </button>
                      <button onClick={()=>setQrGenerated(false)} style={{flex:1,padding:"9px",background:theme.bgDeep,border:`1px solid ${theme.border}`,color:theme.textMuted,borderRadius:8,cursor:"pointer",fontSize:13}}>
                        Regenerate
                      </button>
                    </div>
                    <div style={{background:theme.bgDeep,borderRadius:8,padding:"8px 10px",textAlign:"left"}}>
                      <p style={{color:theme.textMuted,fontSize:10,textTransform:"uppercase",letterSpacing:1,marginBottom:4}}>Cohort</p>
                      <p style={{color:theme.textSub,fontSize:12,fontWeight:600}}>{client} · {cohort}</p>
                      <p style={{color:theme.textMuted,fontSize:11}}>{month} {year}</p>
                    </div>
                  </div>
                )}
              </Card>
            </div>

          </div>
        </div>
      );
    }

    // ─── Password gate ────────────────────────────────────────────────────────
    // Change the value below to set your password.
    const APP_PASSWORD = "ELDP manifesto";

    function PasswordGate({onUnlock, lang}) {
      const [input,setInput]=useState("");
      const [shake,setShake]=useState(false);
      const [error,setError]=useState("");

      const attempt=()=>{
        if (input===APP_PASSWORD) { onUnlock(); }
        else {
          setError("Incorrect password. Please try again.");
          setShake(true);
          setInput("");
          setTimeout(()=>setShake(false),500);
        }
      };

      return (
        <div style={{minHeight:"100vh",background:"#0a0a1a",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"'Segoe UI',system-ui,sans-serif"}}>
          <div style={{
            background:"#12123a",border:"1px solid #2a2a5a",borderRadius:16,padding:"48px 40px",
            width:"100%",maxWidth:400,textAlign:"center",
            transform:shake?"translateX(0)":"none",
            animation:shake?"shake 0.4s ease":"none",
          }}>
            <div style={{width:56,height:56,background:"linear-gradient(135deg,#b026ff,#ff4d6d)",borderRadius:14,display:"flex",alignItems:"center",justifyContent:"center",fontSize:26,margin:"0 auto 20px"}}>✦</div>
            <h1 style={{color:"#fff",fontSize:20,fontWeight:800,marginBottom:6}}>Leadership Analyser</h1>
            <p style={{color:"#888",fontSize:13,marginBottom:32}}>Kraken · Session Response Summary Tool</p>
            <input
              type="password"
              placeholder={T[lang]?.enterPassword||T.en.enterPassword}
              value={input}
              onChange={e=>{setInput(e.target.value);setError("");}}
              onKeyDown={e=>e.key==="Enter"&&attempt()}
              style={{width:"100%",padding:"12px 16px",borderRadius:8,border:`1px solid ${error?"#ff4d6d":"#2a2a5a"}`,background:"#0a0a1a",color:"#fff",fontSize:15,outline:"none",marginBottom:12,fontFamily:"inherit",textAlign:"center",letterSpacing:3}}
            />
            {error&&<p style={{color:"#ff4d6d",fontSize:13,marginBottom:12}}>{T[lang]?.incorrectPassword||T.en.incorrectPassword}</p>}
            <button onClick={attempt} style={{width:"100%",padding:"12px",background:"linear-gradient(135deg,#DE1C80,#C82C84)",border:"none",borderRadius:8,color:"#fff",fontSize:15,fontWeight:700,cursor:"pointer"}}>
              {T[lang]?.enter||T.en.enter}
            </button>
          </div>
          <style>{`@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}`}</style>
        </div>
      );
    }

    // ─── Main App ─────────────────────────────────────────────────────────────

    function App() {
      const [unlocked,setUnlocked]=useState(false);
      const [mainTab,setMainTab]=useState("single");
      const [rows,setRows]=useState([]);
      const [fileName,setFileName]=useState("");
      const [error,setError]=useState("");
      const [cohorts,setCohorts]=useState([]);
      const [dayMap,setDayMap]=useState({});
      const [theme,setTheme]=useState(DEFAULT_THEME);
      const [showBranding,setShowBranding]=useState(false);
      const [lang,setLang]=useState("en");

      if (!unlocked) return (
        <LangContext.Provider value={lang}>
          <div style={{position:"relative"}}>
            <div style={{position:"fixed",top:12,right:12,zIndex:9999}}>
              <select value={lang} onChange={e=>setLang(e.target.value)} style={{background:"#29172E",border:"1px solid #6b3f72",color:"#fff",borderRadius:6,padding:"5px 10px",fontSize:13,cursor:"pointer"}}>
                {LANGUAGES.map(l=><option key={l.code} value={l.code}>{l.label}</option>)}
              </select>
            </div>
            <PasswordGate onUnlock={()=>setUnlocked(true)} lang={lang}/>
          </div>
        </LangContext.Provider>
      );

      const tr = (key) => T[lang]?.[key] ?? T.en[key] ?? key;

      return (
        <LangContext.Provider value={lang}>
        <ThemeContext.Provider value={theme}>
          <div style={{minHeight:"100vh",background:theme.bgMain,fontFamily:"'Montserrat','Segoe UI',system-ui,sans-serif",color:"#fff"}}>

            {/* Header */}
            <div style={{background:`linear-gradient(135deg,${theme.bgCard},${darken(theme.bgMain,-10)})`,borderBottom:`1px solid ${theme.border}`,padding:"20px 32px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
              <div style={{display:"flex",alignItems:"center",gap:16}}>
                <div style={{width:40,height:40,background:`linear-gradient(135deg,${theme.primary},${theme.secondary})`,borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20}}>✦</div>
                <div>
                  <h1 style={{fontSize:20,fontWeight:800,letterSpacing:-0.5}}>{tr("appTitle")}</h1>
                  <p style={{color:theme.textMuted,fontSize:13}}>{tr("appSubtitle")}</p>
                </div>
              </div>
              <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
                {/* Language selector */}
                <select value={lang} onChange={e=>setLang(e.target.value)} style={{background:theme.bgDeep,border:`1px solid ${theme.border}`,color:theme.textSub,borderRadius:8,padding:"8px 12px",fontSize:13,cursor:"pointer",fontFamily:"inherit",fontWeight:600}}>
                  {LANGUAGES.map(l=><option key={l.code} value={l.code}>{l.label}</option>)}
                </select>
                <button onClick={()=>downloadPdf("app-content","kraken-leadership-current-view.pdf")} style={{background:theme.bgDeep,border:`1px solid ${theme.border}`,color:theme.textSub,padding:"8px 12px",borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:600,whiteSpace:"nowrap"}}>
                  {tr("thisPage")}
                </button>
                <button onClick={()=>downloadAllPdf("kraken-leadership-full-report.pdf")} style={{background:theme.bgDeep,border:`1px solid ${theme.border}`,color:theme.textSub,padding:"8px 12px",borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:600,whiteSpace:"nowrap"}}>
                  {tr("fullReport")}
                </button>
                <button onClick={()=>setShowBranding(v=>!v)} style={{background:showBranding?theme.primary:theme.bgDeep,border:`1px solid ${theme.border}`,color:showBranding?"#fff":theme.textSub,padding:"8px 14px",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:600}}>
                  🎨 {tr("branding")}
                </button>
              </div>
            </div>

            {/* Top-level tabs */}
            <div style={{borderBottom:`1px solid ${theme.border}`,background:theme.navBg,padding:"0 32px"}}>
              <div style={{display:"flex",gap:0,maxWidth:960,margin:"0 auto"}}>
                {[
                  {id:"form",label:"📋 Live Form"},
                  {id:"single",label:tr("singleCsv")},
                  {id:"cohorts",label:`${tr("multipleCohorts")}${cohorts.length>0?` (${cohorts.length})`:""}`},
                  {id:"programme",label:`${tr("programmeSetup")}${Object.keys(dayMap).length>0?" ✓":""}`},
                ].map(tb=>(
                  <button key={tb.id} onClick={()=>setMainTab(tb.id)} style={{padding:"14px 24px",border:"none",borderBottom:`3px solid ${mainTab===tb.id?theme.primary:"transparent"}`,background:"none",color:mainTab===tb.id?theme.primary:theme.textMuted,cursor:"pointer",fontWeight:700,fontSize:14,transition:"all 0.2s"}}>
                    {tb.label}
                  </button>
                ))}
              </div>
            </div>

            <div id="app-content" style={{maxWidth:960,margin:"0 auto",padding:"28px 24px"}}>
              {mainTab==="form"&&<LiveForm/>}
              {mainTab==="single"&&<SingleUpload rows={rows} setRows={setRows} fileName={fileName} setFileName={setFileName} error={error} setError={setError} dayMap={dayMap}/>}
              {mainTab==="cohorts"&&<CohortManager cohorts={cohorts} setCohorts={setCohorts} dayMap={dayMap}/>}
              {mainTab==="programme"&&<ProgrammeSetup dayMap={dayMap} setDayMap={setDayMap}/>}
            </div>

            {showBranding&&(
              <>
                <div onClick={()=>setShowBranding(false)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:999}}/>
                <BrandingPanel theme={theme} onThemeChange={setTheme} onClose={()=>setShowBranding(false)}/>
              </>
            )}
          </div>
        </ThemeContext.Provider>
        </LangContext.Provider>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
