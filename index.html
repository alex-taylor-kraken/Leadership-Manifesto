<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TTE UK Leadership Analyser · Kraken</title>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a1a; color: #fff; font-family: 'Segoe UI', system-ui, sans-serif; }
    input[type=color] { -webkit-appearance: none; appearance: none; border: none; cursor: pointer; }
    input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type=color]::-webkit-color-swatch { border: none; border-radius: 6px; }
    input[type=text], input[type=month], select {
      background: #0f0f2a; border: 1px solid #2a2a5a; color: #fff;
      border-radius: 6px; padding: 7px 10px; font-size: 13px; outline: none;
      font-family: inherit;
    }
    input[type=text]:focus, input[type=month]:focus, select:focus { border-color: #b026ff; }
    select option { background: #12123a; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useCallback, useContext, createContext, useRef } = React;

    // ─── Theme ───────────────────────────────────────────────────────────────

    const DEFAULT_THEME = {
      primary:     "#b026ff",
      primaryDark: "#8000cc",
      secondary:   "#ff4d6d",
      strong:      "#00d084",
      developing:  "#f59e0b",
      bgMain:      "#0a0a1a",
      bgCard:      "#12123a",
      bgDeep:      "#0f0f2a",
      bgTrack:     "#1a1a3e",
      bgHover:     "#1a1a4e",
      border:      "#2a2a5a",
      textMuted:   "#888888",
      textSub:     "#aaaaaa",
    };

    const ThemeContext = createContext(DEFAULT_THEME);
    const useTheme = () => useContext(ThemeContext);

    // ─── Colour utilities ─────────────────────────────────────────────────────

    function hexToRgb(hex) {
      return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
    }
    function darken(hex, amount=40) {
      let [r,g,b] = hexToRgb(hex);
      r=Math.max(0,r-amount); g=Math.max(0,g-amount); b=Math.max(0,b-amount);
      return `#${r.toString(16).padStart(2,"0")}${g.toString(16).padStart(2,"0")}${b.toString(16).padStart(2,"0")}`;
    }
    function extractColours(imgEl, count=10) {
      const canvas=document.createElement("canvas"); canvas.width=120; canvas.height=120;
      const ctx=canvas.getContext("2d"); ctx.drawImage(imgEl,0,0,120,120);
      const data=ctx.getImageData(0,0,120,120).data;
      const pixels=[];
      for (let i=0;i<data.length;i+=4) {
        const r=data[i],g=data[i+1],b=data[i+2],a=data[i+3];
        if (a<128) continue;
        const max=Math.max(r,g,b),min=Math.min(r,g,b);
        const sat=max===0?0:(max-min)/max, light=(max+min)/510;
        if (sat>0.15&&light>0.08&&light<0.92) pixels.push([r,g,b]);
      }
      const clusters=[],threshold=55;
      pixels.forEach(p=>{
        let nearest=-1,nearestDist=Infinity;
        clusters.forEach((c,i)=>{ const d=Math.sqrt((p[0]-c.r)**2+(p[1]-c.g)**2+(p[2]-c.b)**2); if(d<nearestDist){nearestDist=d;nearest=i;} });
        if (nearest>=0&&nearestDist<threshold) { const c=clusters[nearest]; c.r=(c.r*c.count+p[0])/(c.count+1); c.g=(c.g*c.count+p[1])/(c.count+1); c.b=(c.b*c.count+p[2])/(c.count+1); c.count++; }
        else clusters.push({r:p[0],g:p[1],b:p[2],count:1});
      });
      clusters.sort((a,b)=>b.count-a.count);
      return clusters.slice(0,count).map(c=>`#${Math.round(c.r).toString(16).padStart(2,"0")}${Math.round(c.g).toString(16).padStart(2,"0")}${Math.round(c.b).toString(16).padStart(2,"0")}`);
    }

    // ─── CSV Parser ───────────────────────────────────────────────────────────

    function parseCSV(text) {
      const lines=text.trim().split("\n"); if (lines.length<2) return [];
      const rows=[];
      for (let i=1;i<lines.length;i++) {
        const cols=[]; let cur="",inQ=false;
        for (const ch of lines[i]) { if(ch==='"'){inQ=!inQ;} else if(ch===','&&!inQ){cols.push(cur.trim());cur="";} else{cur+=ch;} }
        cols.push(cur.trim());
        if (cols.length>=5) rows.push({session:cols[1]?.trim()||"",q1:parseFloat(cols[2])||null,q2:parseFloat(cols[3])||null,q3:cols[4]?.trim()||""});
      }
      return rows.filter(r=>r.session);
    }

    // ─── Mappings ─────────────────────────────────────────────────────────────

    const SIX_AREAS=["Purposeful Vision","Psychological Safety","Purposeful Technology","Disciplined Freedom","Adaptive Leadership","Radical Interdependence"];
    const COMPETENCIES=["Psychological Safety","Conscious Leadership","Empowerment","Systems Thinking","Agility","Turning Points","Rituals","Storytelling"];

    const SESSION_TO_SIX={
      "a brief history of kraken human design":["Purposeful Vision","Purposeful Technology","Adaptive Leadership"],
      "the emotional landscape of transformation":["Purposeful Vision","Psychological Safety","Adaptive Leadership"],
      "power dynamics (ego/drama triangle)":["Psychological Safety","Disciplined Freedom","Adaptive Leadership"],
      "navigating complexity (turning points)":["Purposeful Vision","Psychological Safety","Purposeful Technology","Disciplined Freedom","Adaptive Leadership"],
      "psychological safety":["Psychological Safety","Disciplined Freedom","Adaptive Leadership","Radical Interdependence"],
      "empowering others (vmost/multipliers)":["Psychological Safety","Disciplined Freedom","Adaptive Leadership"],
      "customer centricity":["Purposeful Vision","Purposeful Technology","Radical Interdependence"],
      "agile leadership and agile governance":["Purposeful Technology","Disciplined Freedom","Adaptive Leadership","Radical Interdependence"],
      "risk mindset":["Psychological Safety","Disciplined Freedom","Adaptive Leadership","Radical Interdependence"],
      "problem solving & course correcting":["Purposeful Technology","Adaptive Leadership"],
      "narrative leadership: storytelling for a change":["Purposeful Vision","Adaptive Leadership","Radical Interdependence"],
      "conscious leadership":["Purposeful Vision","Disciplined Freedom","Adaptive Leadership"],
    };
    const SESSION_TO_COMP={
      "a brief history of kraken human design":[],
      "the emotional landscape of transformation":["Psychological Safety","Conscious Leadership"],
      "power dynamics (ego/drama triangle)":["Psychological Safety","Conscious Leadership"],
      "navigating complexity (turning points)":["Turning Points"],
      "psychological safety":["Psychological Safety"],
      "empowering others (vmost/multipliers)":["Empowerment"],
      "customer centricity":[],
      "agile leadership and agile governance":["Agility"],
      "risk mindset":[],
      "problem solving & course correcting":["Systems Thinking"],
      "narrative leadership: storytelling for a change":["Storytelling"],
      "conscious leadership":[],
    };

    function avgScores(rows,keys,mapping) {
      const out={};
      keys.forEach(area=>{
        const rel=rows.filter(r=>(mapping[r.session.toLowerCase()]||[]).includes(area));
        const q1s=rel.map(r=>r.q1).filter(Boolean), q2s=rel.map(r=>r.q2).filter(Boolean);
        out[area]={q1Avg:q1s.length?q1s.reduce((a,b)=>a+b,0)/q1s.length:null, q2Avg:q2s.length?q2s.reduce((a,b)=>a+b,0)/q2s.length:null, count:rel.length};
      });
      return out;
    }
    // ─── Shared UI atoms ─────────────────────────────────────────────────────

    function ScoreBar({value,max=10,color}) {
      const theme=useTheme(); const pct=value!==null?(value/max)*100:0;
      return (
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <div style={{flex:1,height:10,background:theme.bgTrack,borderRadius:5,overflow:"hidden"}}>
            <div style={{width:`${pct}%`,height:"100%",background:color||theme.primary,borderRadius:5,transition:"width 0.6s ease"}}/>
          </div>
          <span style={{color:"#fff",fontWeight:700,minWidth:32,fontSize:14}}>{value!==null?value.toFixed(1):"—"}</span>
        </div>
      );
    }
    function Card({children,style}) {
      const theme=useTheme();
      return <div style={{background:theme.bgCard,border:`1px solid ${theme.border}`,borderRadius:12,padding:"16px 20px",marginBottom:12,...style}}>{children}</div>;
    }
    function TabBar({tabs,active,onChange,pill=false}) {
      const theme=useTheme();
      return (
        <div style={{display:"flex",gap:4,background:theme.bgDeep,borderRadius:10,padding:4}}>
          {tabs.map(t=>(
            <button key={t.id} onClick={()=>onChange(t.id)} style={{flex:1,padding:"10px 16px",borderRadius:8,border:"none",cursor:"pointer",fontWeight:600,fontSize:14,
              background:active===t.id?(pill?theme.bgCard:`linear-gradient(135deg,${theme.primary},${theme.primaryDark})`):"transparent",
              color:active===t.id?(pill?theme.primary:"#fff"):theme.textMuted,transition:"all 0.2s"}}>
              {t.label}
            </button>
          ))}
        </div>
      );
    }
    function ScoreLegend() {
      const theme=useTheme();
      return (
        <div style={{display:"flex",gap:16,marginBottom:20,flexWrap:"wrap"}}>
          {[{color:theme.strong,label:"Strong (7–10)"},{color:theme.developing,label:"Developing (4–6)"},{color:theme.secondary,label:"Emerging (1–3)"},{color:theme.border,label:"No data"}].map(({color,label})=>(
            <div key={label} style={{display:"flex",alignItems:"center",gap:6}}>
              <div style={{width:12,height:12,borderRadius:3,background:color}}/>
              <span style={{color:theme.textSub,fontSize:13}}>{label}</span>
            </div>
          ))}
        </div>
      );
    }

    // ─── Score colour helper (single source of truth) ─────────────────────────

    function scoreColor(value, theme) {
      if (value === null) return theme.border;
      if (value >= 7)    return theme.strong;
      if (value >= 4)    return theme.developing;
      return theme.secondary;
    }

    // ─── Analysis components ──────────────────────────────────────────────────

    function AreaCard({name,data,clientName}) {
      const theme=useTheme();
      const client=clientName||"this organisation";
      if (!data||data.count===0) return (
        <Card><h3 style={{color:theme.primary,marginBottom:6,fontSize:16}}>{name}</h3><p style={{color:theme.textMuted,fontSize:13}}>No responses mapped to this area</p></Card>
      );
      return (
        <Card style={{borderLeft:`3px solid ${scoreColor(data.q1Avg,theme)}`}}>
          <h3 style={{color:"#fff",marginBottom:12,fontSize:16}}>{name}</h3>
          <div style={{marginBottom:8}}>
            <label style={{color:theme.textSub,fontSize:12,display:"block",marginBottom:4}}>How is <strong style={{color:"#fff"}}>{client}</strong> currently conducting this?</label>
            <ScoreBar value={data.q1Avg} color={scoreColor(data.q1Avg,theme)}/>
          </div>
          <div>
            <label style={{color:theme.textSub,fontSize:12,display:"block",marginBottom:4}}>How easy will it be to make meaningful progress in this area?</label>
            <ScoreBar value={data.q2Avg} color={scoreColor(data.q2Avg,theme)}/>
          </div>
        </Card>
      );
    }

    function SixAreasView({scores,clientName}) {
      return (
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
          {SIX_AREAS.map(area=><AreaCard key={area} name={area} data={scores[area]} clientName={clientName}/>)}
        </div>
      );
    }

    function WheelView({scores}) {
      const theme=useTheme();
      const Ring=({areas,label})=>(
        <div style={{marginBottom:24}}>
          <h4 style={{color:theme.textMuted,fontSize:12,textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>{label}</h4>
          <div style={{display:"grid",gridTemplateColumns:`repeat(${areas.length},1fr)`,gap:10}}>
            {areas.map(area=>{
              const d=scores[area]; const q1=d?.q1Avg??null; const q2=d?.q2Avg??null;
              return (
                <div key={area} style={{background:theme.bgCard,border:`2px solid ${scoreColor(q1,theme)}`,borderRadius:12,padding:"16px 20px"}}>
                  <div style={{color:"#fff",fontWeight:700,fontSize:14,marginBottom:10}}>{area}</div>
                  <div style={{marginBottom:6}}><span style={{color:theme.textSub,fontSize:11}}>Q1 Position</span><ScoreBar value={q1} color={scoreColor(q1,theme)}/></div>
                  <div><span style={{color:theme.textSub,fontSize:11}}>Q2 Progress ease</span><ScoreBar value={q2} color={scoreColor(q2,theme)}/></div>
                </div>
              );
            })}
          </div>
        </div>
      );
      return (
        <div>
          <Ring areas={["Psychological Safety","Conscious Leadership"]} label="Core — Inner Ring"/>
          <Ring areas={["Empowerment","Systems Thinking","Agility"]} label="Middle Ring"/>
          <Ring areas={["Turning Points","Rituals","Storytelling"]} label="Outer Ring"/>
        </div>
      );
    }

    // ─── Q3 theme clustering ──────────────────────────────────────────────────
    // Groups responses by shared keywords/themes and returns the top N clusters.
    // Each cluster has a label (the most representative phrase) and the responses
    // that belong to it.

    const THEME_SEEDS = [
      { label: "Psychological safety & open communication", keywords: ["safe","safety","speak","voice","honest","open","listen","trust","fear","psycholog"] },
      { label: "Empowerment & autonomy", keywords: ["empower","autonomy","autonomous","own","ownership","trust people","delegate","freedom"] },
      { label: "Clarity of vision & purpose", keywords: ["vision","purpose","clarity","clear","direction","why","narrative","north star","goal"] },
      { label: "Collaboration & teamwork", keywords: ["collaborat","together","team","collective","interdepend","partner","joint","cross"] },
      { label: "Accountability & consistency", keywords: ["accountab","consist","commit","follow through","deliver","discipline","responsib"] },
      { label: "Agility & adaptability", keywords: ["agil","adapt","change","flex","pivot","learn","growth","evolve","experiment","fail"] },
      { label: "Inclusive & visible leadership", keywords: ["inclus","diverse","visible","present","show up","model","example","lead by"] },
      { label: "Decision-making & courage", keywords: ["decid","decision","courage","bold","brave","difficult","challenge","risk","stand"] },
      { label: "Wellbeing & human-centred", keywords: ["wellbeing","well-being","human","people first","care","compassion","support","thrive"] },
      { label: "Innovation & learning culture", keywords: ["innovat","learn","curious","experiment","idea","creative","test","improve","develop"] },
    ];

    function clusterResponses(responses) {
      const scored = responses.map(r => {
        const lower = r.toLowerCase();
        const matches = THEME_SEEDS.map((seed, idx) => ({
          idx,
          score: seed.keywords.filter(kw => lower.includes(kw)).length,
        })).filter(m => m.score > 0).sort((a,b) => b.score - a.score);
        return { text: r, topSeed: matches[0]?.idx ?? -1 };
      });

      const buckets = {};
      scored.forEach(({ text, topSeed }) => {
        const key = topSeed === -1 ? "__other__" : topSeed;
        if (!buckets[key]) buckets[key] = [];
        buckets[key].push(text);
      });

      const clusters = Object.entries(buckets)
        .filter(([k]) => k !== "__other__")
        .map(([k, texts]) => ({ label: THEME_SEEDS[Number(k)].label, texts, count: texts.length }))
        .sort((a,b) => b.count - a.count)
        .slice(0, 6);

      return clusters;
    }

    // Build a 1–2 sentence description of a cluster from its actual responses.
    // Strategy: extract the most distinctive noun phrases / verb phrases from the
    // texts and weave them into a readable summary sentence.
    function describeCluster(texts) {
      if (texts.length === 0) return "";

      // Pull out unique non-trivial words (>4 chars) across all responses
      const stopWords = new Set(["their","there","where","which","should","would","could","about","these","those","being","having","making","doing","going","with","that","this","from","have","will","when","what","your","they","them","into","also","more","such","each","than","then","then","just","very","much","some","like","been","well","need","make","take","give","show","help","work","team","lead","leadership","people","organisation","organization"]);

      const wordFreq = {};
      texts.forEach(t => {
        t.toLowerCase().replace(/[^a-z\s]/g,"").split(/\s+/).forEach(w => {
          if (w.length > 4 && !stopWords.has(w)) wordFreq[w] = (wordFreq[w]||0) + 1;
        });
      });

      // Top recurring words that give flavour
      const topWords = Object.entries(wordFreq)
        .sort((a,b) => b[1]-a[1])
        .slice(0, 8)
        .map(([w]) => w);

      // Pick the most "complete" response as the anchor (longest that reads like a principle)
      const anchor = texts
        .map(t => ({ t, score: t.split(" ").length + (t.includes(" that ")||t.includes(" where ")||t.includes(" who ")?3:0) }))
        .sort((a,b) => b.score - a.score)[0].t;

      // Build description: how many responses, the anchor idea, any flavour words not already in anchor
      const anchorLower = anchor.toLowerCase();
      const flavour = topWords.filter(w => !anchorLower.includes(w)).slice(0,3);

      let desc = `${texts.length > 1 ? `${texts.length} respondents touched on` : "One respondent focused on"} this theme. `;

      // Summarise what they collectively said
      if (texts.length === 1) {
        desc += `The response emphasises: "${anchor}."`;
      } else {
        // Use anchor as the representative principle
        desc += `A representative view: "${anchor.charAt(0).toUpperCase() + anchor.slice(1).replace(/\.?$/,'.')}"`;
        if (flavour.length > 0) {
          desc += ` Other responses also highlighted ${flavour.join(", ")}.`;
        }
      }
      return desc;
    }

    // "Powerful" = long, uses vivid language, structurally clear (a principle-like sentence)
    function pickPowerful(responses, n=3) {
      const POWER_WORDS = ["always","never","must","ensure","every","commit","bold","trust","courage","create","build","enable","champion","foster","drive","empower","lead","hold","own"];
      const scored = responses.map(r => {
        const lower = r.toLowerCase();
        const words = r.split(/\s+/);
        let score = 0;
        score += Math.min(words.length / 4, 5);           // length bonus (max 5)
        score += POWER_WORDS.filter(w => lower.includes(w)).length * 1.5;
        if (/^[A-Z]/.test(r)) score += 1;                 // starts with capital
        if (!r.endsWith("?")) score += 0.5;               // not a question
        if (r.includes(" that ") || r.includes(" where ") || r.includes(" who ")) score += 1; // principle-like structure
        return { text: r, score };
      });
      return scored.sort((a,b) => b.score - a.score).slice(0, n).map(s => s.text);
    }

    function Q3Panel({rows}) {
      const theme=useTheme();
      const [showAll,setShowAll]=useState(false);
      const responses=rows.map(r=>r.q3).filter(r=>r.trim().length>0);

      if (responses.length===0) return <Card><p style={{color:theme.textMuted}}>No Q3 responses to display.</p></Card>;

      const clusters=clusterResponses(responses);
      const powerful=pickPowerful(responses,3);

      return (
        <div>
          {/* Top 6 themes */}
          <Card style={{borderColor:theme.developing,borderWidth:2,marginBottom:16}}>
            <h3 style={{color:theme.developing,marginBottom:4}}>Top Themes</h3>
            <p style={{color:theme.textSub,fontSize:13,marginBottom:16}}>The 6 most common leadership principles emerging from responses</p>
            {clusters.length===0
              ? <p style={{color:theme.textMuted,fontSize:13}}>Not enough variety to cluster — see all responses below.</p>
              : clusters.map((c,i)=>(
                <div key={i} style={{marginBottom:16,paddingBottom:16,borderBottom:i<clusters.length-1?`1px solid ${theme.border}`:"none"}}>
                  <div style={{display:"flex",gap:12,alignItems:"flex-start",marginBottom:8}}>
                    <div style={{minWidth:28,height:28,borderRadius:"50%",background:`${theme.developing}22`,border:`2px solid ${theme.developing}`,display:"flex",alignItems:"center",justifyContent:"center",color:theme.developing,fontWeight:800,fontSize:13,flexShrink:0}}>
                      {i+1}
                    </div>
                    <div style={{flex:1}}>
                      <div style={{color:"#fff",fontWeight:700,fontSize:14,marginBottom:2}}>{c.label}</div>
                      <div style={{color:theme.textMuted,fontSize:12}}>{c.count} response{c.count!==1?"s":""} in this theme</div>
                    </div>
                    <div style={{color:theme.developing,fontWeight:800,fontSize:20,flexShrink:0}}>{c.count}</div>
                  </div>
                  <div style={{marginLeft:40,color:theme.textSub,fontSize:13,lineHeight:1.6,fontStyle:"italic"}}>
                    {describeCluster(c.texts)}
                  </div>
                </div>
              ))
            }
          </Card>

          {/* 3 powerful quotes */}
          <Card style={{borderColor:theme.primary,borderWidth:2,marginBottom:16}}>
            <h3 style={{color:theme.primary,marginBottom:4}}>✦ Most Powerful Principles</h3>
            <p style={{color:theme.textSub,fontSize:13,marginBottom:16}}>Three responses with the most impact and clarity</p>
            {powerful.map((r,i)=>(
              <div key={i} style={{background:theme.bgHover,borderLeft:`3px solid ${theme.primary}`,padding:"12px 16px",marginBottom:10,borderRadius:"0 8px 8px 0",color:"#fff",fontStyle:"italic",fontSize:15,lineHeight:1.5}}>
                "{r}"
              </div>
            ))}
          </Card>

          {/* All responses collapsible */}
          <Card>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer"}} onClick={()=>setShowAll(v=>!v)}>
              <h3 style={{color:"#fff"}}>All Leadership Principles ({responses.length})</h3>
              <span style={{color:theme.textMuted,fontSize:13}}>{showAll?"▲ Hide":"▼ Show all"}</span>
            </div>
            {showAll&&(
              <div style={{marginTop:12}}>
                {responses.map((r,i)=>(
                  <div key={i} style={{borderBottom:`1px solid ${theme.border}`,padding:"10px 0",color:"#ccc",fontSize:14}}>
                    {i+1}. {r}
                  </div>
                ))}
              </div>
            )}
          </Card>
        </div>
      );
    }

    function SessionBreakdown({rows}) {
      const theme=useTheme();
      const sessions={};
      rows.forEach(r=>{ if(!sessions[r.session]) sessions[r.session]=[]; sessions[r.session].push(r); });
      return (
        <Card>
          <h3 style={{color:"#fff",marginBottom:12}}>Responses by Session</h3>
          {Object.entries(sessions).map(([session,sRows])=>{
            const q1s=sRows.map(r=>r.q1).filter(Boolean),q2s=sRows.map(r=>r.q2).filter(Boolean);
            const q1a=q1s.length?q1s.reduce((a,b)=>a+b,0)/q1s.length:null;
            const q2a=q2s.length?q2s.reduce((a,b)=>a+b,0)/q2s.length:null;
            return (
              <div key={session} style={{borderBottom:`1px solid ${theme.border}`,padding:"10px 0"}}>
                <div style={{color:"#fff",fontWeight:600,marginBottom:6}}>{session}</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                  <div><span style={{color:theme.textSub,fontSize:11}}>Q1 avg ({q1s.length})</span><ScoreBar value={q1a} color={scoreColor(q1a,theme)}/></div>
                  <div><span style={{color:theme.textSub,fontSize:11}}>Q2 avg ({q2s.length})</span><ScoreBar value={q2a} color={scoreColor(q2a,theme)}/></div>
                </div>
              </div>
            );
          })}
        </Card>
      );
    }

    // ─── Analysis View (shared between single & multi cohort) ─────────────────

    function AnalysisView({rows,clientName}) {
      const theme=useTheme();
      const [activeSection,setActiveSection]=useState("scores");
      const [activeTab,setActiveTab]=useState("six");
      const sixScores=avgScores(rows,SIX_AREAS,SESSION_TO_SIX);
      const compScores=avgScores(rows,COMPETENCIES,SESSION_TO_COMP);
      return (
        <div>
          <div style={{marginBottom:24}}>
            <TabBar tabs={[{id:"scores",label:"Scores by Area"},{id:"q3",label:"Leadership Principles (Q3)"},{id:"sessions",label:"By Session"}]} active={activeSection} onChange={setActiveSection}/>
          </div>
          {activeSection==="scores"&&(
            <>
              <div style={{maxWidth:480,marginBottom:20}}>
                <TabBar tabs={[{id:"six",label:"Oxford's 6 Transformation Skills"},{id:"wheel",label:"Competency Wheel"}]} active={activeTab} onChange={setActiveTab} pill/>
              </div>
              <ScoreLegend/>
              {activeTab==="six"&&(
                <>
                  <p style={{color:theme.textSub,fontSize:13,marginBottom:16}}>Scores mapped to Oxford's 6 transformation skills framework. Each session contributes to all areas it maps to.</p>
                  <SixAreasView scores={sixScores} clientName={clientName}/>
                </>
              )}
              {activeTab==="wheel"&&(
                <>
                  <p style={{color:theme.textSub,fontSize:13,marginBottom:16}}>Scores mapped to the competency wheel. Inner ring represents core competencies.</p>
                  <WheelView scores={compScores}/>
                </>
              )}
            </>
          )}
          {activeSection==="q3"&&<Q3Panel rows={rows}/>}
          {activeSection==="sessions"&&<SessionBreakdown rows={rows}/>}
        </div>
      );
    }

    // ─── Cohort Manager ───────────────────────────────────────────────────────

    const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
    const YEARS=Array.from({length:10},(_,i)=>(new Date().getFullYear()-5+i).toString());

    function CohortManager({cohorts,setCohorts}) {
      const theme=useTheme();
      const [pending,setPending]=useState({client:"",cohort:"",month:"",year:"",rows:[],fileName:""});
      const [addError,setAddError]=useState("");
      const [activeCohortId,setActiveCohortId]=useState(null);
      const [compareMode,setCompareMode]=useState(false);
      const [editingId,setEditingId]=useState(null);

      const handleCSV=(file)=>{
        if (!file) return;
        const reader=new FileReader();
        reader.onload=(e)=>{
          try {
            const parsed=parseCSV(e.target.result);
            if (parsed.length===0){setAddError("No data rows found. Please check your CSV format.");return;}
            setPending(p=>({...p,rows:parsed,fileName:file.name}));
            setAddError("");
          } catch {setAddError("Failed to parse CSV.");}
        };
        reader.readAsText(file);
      };

      const addCohort=()=>{
        if (!pending.client.trim()){setAddError("Please enter a client name.");return;}
        if (!pending.cohort.trim()){setAddError("Please enter a cohort name.");return;}
        if (!pending.month){setAddError("Please select a month.");return;}
        if (!pending.year){setAddError("Please select a year.");return;}
        if (pending.rows.length===0){setAddError("Please upload a CSV file.");return;}
        const newId=Date.now().toString();
        const newCohort={id:newId,...pending};
        setCohorts(c=>[...c,newCohort]);
        setActiveCohortId(newId);
        setPending({client:"",cohort:"",month:"",year:"",rows:[],fileName:""});
        setAddError("");
        setCompareMode(false);
      };

      const removeCohort=(id)=>{
        setCohorts(c=>c.filter(c=>c.id!==id));
        if (activeCohortId===id) setActiveCohortId(cohorts.filter(c=>c.id!==id)[0]?.id||null);
      };

      const updateLabel=(id,field,value)=>{
        setCohorts(cs=>cs.map(c=>c.id===id?{...c,[field]:value}:c));
      };

      const activeCohort=cohorts.find(c=>c.id===activeCohortId);

      // For compare: merge all cohort rows
      const allRows=cohorts.flatMap(c=>c.rows);

      const inputStyle={width:"100%",marginTop:4};
      const fieldStyle={flex:1,minWidth:120};

      return (
        <div>
          {/* Add cohort form */}
          <Card style={{marginBottom:20,borderColor:theme.primary,borderWidth:1.5}}>
            <h3 style={{color:theme.primary,marginBottom:16,fontSize:15}}>+ Add a cohort</h3>
            <div style={{display:"flex",gap:12,flexWrap:"wrap",marginBottom:12}}>
              <div style={fieldStyle}>
                <label style={{color:theme.textSub,fontSize:12}}>Client name *</label>
                <input type="text" placeholder="e.g. TTE UK" value={pending.client} onChange={e=>setPending(p=>({...p,client:e.target.value}))} style={inputStyle}/>
              </div>
              <div style={fieldStyle}>
                <label style={{color:theme.textSub,fontSize:12}}>Cohort name *</label>
                <input type="text" placeholder="e.g. Cohort A" value={pending.cohort} onChange={e=>setPending(p=>({...p,cohort:e.target.value}))} style={inputStyle}/>
              </div>
              <div style={{flex:"0 0 130px"}}>
                <label style={{color:theme.textSub,fontSize:12}}>Month *</label>
                <select value={pending.month} onChange={e=>setPending(p=>({...p,month:e.target.value}))} style={{...inputStyle}}>
                  <option value="">Month</option>
                  {MONTHS.map(m=><option key={m} value={m}>{m}</option>)}
                </select>
              </div>
              <div style={{flex:"0 0 100px"}}>
                <label style={{color:theme.textSub,fontSize:12}}>Year *</label>
                <select value={pending.year} onChange={e=>setPending(p=>({...p,year:e.target.value}))} style={{...inputStyle}}>
                  <option value="">Year</option>
                  {YEARS.map(y=><option key={y} value={y}>{y}</option>)}
                </select>
              </div>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
              <label style={{background:theme.bgDeep,border:`1px dashed ${pending.rows.length>0?theme.strong:theme.border}`,borderRadius:8,padding:"8px 16px",cursor:"pointer",fontSize:13,color:pending.rows.length>0?theme.strong:theme.textSub,display:"flex",alignItems:"center",gap:8}}>
                {pending.rows.length>0 ? `✓ ${pending.fileName} (${pending.rows.length} rows)` : "📂 Upload CSV"}
                <input type="file" accept=".csv" onChange={e=>handleCSV(e.target.files[0])} style={{display:"none"}}/>
              </label>
              <button onClick={addCohort} style={{background:`linear-gradient(135deg,${theme.primary},${theme.primaryDark})`,color:"#fff",border:"none",padding:"9px 20px",borderRadius:8,cursor:"pointer",fontWeight:700,fontSize:14}}>
                Add cohort
              </button>
            </div>
            {addError&&<p style={{color:theme.secondary,fontSize:13,marginTop:10}}>{addError}</p>}
          </Card>

          {cohorts.length===0&&(
            <div style={{textAlign:"center",padding:"48px 24px",color:theme.textMuted}}>
              <div style={{fontSize:40,marginBottom:12}}>📋</div>
              <p>No cohorts added yet. Fill in the form above to add your first one.</p>
            </div>
          )}

          {cohorts.length>0&&(
            <>
              {/* Cohort pill selector */}
              <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:20,alignItems:"center"}}>
                {cohorts.map(c=>(
                  <div key={c.id} style={{display:"flex",alignItems:"center",gap:0}}>
                    {editingId===c.id ? (
                      <div style={{background:theme.bgCard,border:`2px solid ${theme.primary}`,borderRadius:10,padding:"6px 10px",display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
                        <input type="text" value={c.client} onChange={e=>updateLabel(c.id,"client",e.target.value)} style={{width:110}} placeholder="Client"/>
                        <input type="text" value={c.cohort} onChange={e=>updateLabel(c.id,"cohort",e.target.value)} style={{width:90}} placeholder="Cohort"/>
                        <select value={c.month} onChange={e=>updateLabel(c.id,"month",e.target.value)} style={{width:110}}>
                          {MONTHS.map(m=><option key={m} value={m}>{m}</option>)}
                        </select>
                        <select value={c.year} onChange={e=>updateLabel(c.id,"year",e.target.value)} style={{width:80}}>
                          {YEARS.map(y=><option key={y} value={y}>{y}</option>)}
                        </select>
                        <button onClick={()=>setEditingId(null)} style={{background:theme.strong,border:"none",color:"#fff",borderRadius:6,padding:"4px 10px",cursor:"pointer",fontSize:12,fontWeight:700}}>Done</button>
                      </div>
                    ) : (
                      <button
                        onClick={()=>{ setActiveCohortId(c.id); setCompareMode(false); }}
                        style={{
                          padding:"8px 14px",borderRadius:"8px 0 0 8px",border:`1px solid ${activeCohortId===c.id&&!compareMode?theme.primary:theme.border}`,
                          background:activeCohortId===c.id&&!compareMode?`${theme.primary}22`:theme.bgCard,
                          color:activeCohortId===c.id&&!compareMode?theme.primary:"#ccc",
                          cursor:"pointer",fontWeight:600,fontSize:13,
                        }}>
                        <span style={{opacity:0.7,fontSize:11}}>{c.client} · {c.cohort}</span>
                        <br/>
                        <span style={{fontSize:12}}>{c.month} {c.year}</span>
                      </button>
                    )}
                    {editingId!==c.id&&(
                      <div style={{display:"flex",flexDirection:"column",borderLeft:"none"}}>
                        <button onClick={()=>setEditingId(c.id)} title="Edit labels" style={{background:theme.bgDeep,border:`1px solid ${theme.border}`,borderLeft:"none",borderBottom:"none",color:theme.textMuted,padding:"4px 8px",cursor:"pointer",fontSize:11,borderRadius:"0 6px 0 0"}}>✎</button>
                        <button onClick={()=>removeCohort(c.id)} title="Remove" style={{background:theme.bgDeep,border:`1px solid ${theme.border}`,borderLeft:"none",color:"#ff4d6d",padding:"4px 8px",cursor:"pointer",fontSize:11,borderRadius:"0 0 6px 0"}}>✕</button>
                      </div>
                    )}
                  </div>
                ))}
                {cohorts.length>1&&(
                  <button
                    onClick={()=>setCompareMode(true)}
                    style={{padding:"8px 16px",borderRadius:8,border:`1px solid ${compareMode?theme.primary:theme.border}`,background:compareMode?`${theme.primary}22`:theme.bgDeep,color:compareMode?theme.primary:theme.textSub,cursor:"pointer",fontWeight:600,fontSize:13}}>
                    ⇄ Compare all
                  </button>
                )}
              </div>

              {/* Active cohort label */}
              {!compareMode&&activeCohort&&(
                <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:20,padding:"10px 16px",background:theme.bgCard,borderRadius:10,border:`1px solid ${theme.border}`}}>
                  <div style={{width:8,height:8,borderRadius:"50%",background:theme.primary}}/>
                  <div>
                    <span style={{color:"#fff",fontWeight:700}}>{activeCohort.client}</span>
                    <span style={{color:theme.textMuted,marginLeft:8}}>·</span>
                    <span style={{color:theme.textSub,marginLeft:8}}>{activeCohort.cohort}</span>
                    <span style={{color:theme.textMuted,marginLeft:8}}>·</span>
                    <span style={{color:theme.textSub,marginLeft:8}}>{activeCohort.month} {activeCohort.year}</span>
                  </div>
                  <div style={{marginLeft:"auto",color:theme.textMuted,fontSize:13}}>{activeCohort.rows.length} responses</div>
                </div>
              )}

              {compareMode&&(
                <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:20,padding:"10px 16px",background:`${theme.primary}11`,borderRadius:10,border:`1px solid ${theme.primary}`}}>
                  <div style={{width:8,height:8,borderRadius:"50%",background:theme.primary}}/>
                  <span style={{color:theme.primary,fontWeight:700}}>Comparing all {cohorts.length} cohorts</span>
                  <span style={{color:theme.textMuted,fontSize:13,marginLeft:8}}>— {allRows.length} total responses across {cohorts.map(c=>`${c.client} ${c.cohort} (${c.month} ${c.year})`).join(", ")}</span>
                </div>
              )}

              {/* Analysis */}
              {!compareMode&&activeCohort&&<AnalysisView rows={activeCohort.rows} clientName={activeCohort.client}/>}
              {compareMode&&<AnalysisView rows={allRows} clientName={cohorts.map(c=>c.client).filter((v,i,a)=>a.indexOf(v)===i).join(" & ")}/>}
            </>
          )}
        </div>
      );
    }

    // ─── Branding Panel ───────────────────────────────────────────────────────

    function BrandingPanel({theme,onThemeChange,onClose}) {
      const [extracted,setExtracted]=useState([]);
      const [paletteImg,setPaletteImg]=useState(null);
      const [dragging,setDragging]=useState(false);

      const handlePaletteFile=(file)=>{
        if (!file||!file.type.startsWith("image/")) return;
        const url=URL.createObjectURL(file); setPaletteImg(url);
        const img=new Image();
        img.onload=()=>setExtracted(extractColours(img));
        img.src=url;
      };

      const SwatchRow=({label,roleKey,size=32})=>(
        <div style={{marginBottom:16}}>
          <p style={{color:theme.textSub,fontSize:12,textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>{label}</p>
          <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
            {extracted.map((hex,i)=>(
              <div key={i} title={hex} style={{width:size,height:size,borderRadius:6,background:hex,cursor:"pointer",border:theme[roleKey]===hex?"3px solid #fff":"2px solid transparent",transition:"transform 0.1s",boxShadow:"0 2px 8px rgba(0,0,0,0.4)"}}
                onClick={()=>{ if(roleKey==="primary") onThemeChange({...theme,primary:hex,primaryDark:darken(hex,50)}); else onThemeChange({...theme,[roleKey]:hex}); }}
                onMouseEnter={e=>e.currentTarget.style.transform="scale(1.1)"}
                onMouseLeave={e=>e.currentTarget.style.transform="scale(1)"}/>
            ))}
          </div>
        </div>
      );

      return (
        <div style={{position:"fixed",top:0,right:0,bottom:0,width:360,background:theme.bgCard,borderLeft:`1px solid ${theme.border}`,zIndex:1000,overflowY:"auto",padding:24,boxShadow:"-8px 0 32px rgba(0,0,0,0.5)"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:24}}>
            <h2 style={{color:"#fff",fontSize:18}}>Branding</h2>
            <button onClick={onClose} style={{background:"none",border:"none",color:theme.textMuted,fontSize:22,cursor:"pointer"}}>✕</button>
          </div>
          <div onDragOver={e=>{e.preventDefault();setDragging(true);}} onDragLeave={()=>setDragging(false)} onDrop={e=>{e.preventDefault();setDragging(false);handlePaletteFile(e.dataTransfer.files[0]);}}
            style={{border:`2px dashed ${dragging?theme.primary:theme.border}`,borderRadius:12,padding:"20px 16px",textAlign:"center",background:dragging?`${theme.primary}22`:theme.bgDeep,marginBottom:20,transition:"all 0.2s"}}>
            {paletteImg?<img src={paletteImg} alt="palette" style={{maxWidth:"100%",maxHeight:120,borderRadius:8,marginBottom:10}}/>:<div style={{fontSize:32,marginBottom:8}}>🎨</div>}
            <p style={{color:theme.textMuted,fontSize:13,marginBottom:12}}>{paletteImg?"Upload a different palette":"Upload a colour palette image"}</p>
            <label style={{background:theme.primary,color:"#fff",padding:"8px 18px",borderRadius:7,cursor:"pointer",fontWeight:600,fontSize:13}}>
              Choose image<input type="file" accept="image/*" onChange={e=>handlePaletteFile(e.target.files[0])} style={{display:"none"}}/>
            </label>
          </div>
          {extracted.length>0&&(
            <div style={{marginBottom:24}}>
              <SwatchRow label="Primary accent" roleKey="primary" size={44}/>
              <SwatchRow label="Strong score (7–10)" roleKey="strong"/>
              <SwatchRow label="Developing score (4–6)" roleKey="developing"/>
              <SwatchRow label="Emerging score (1–3)" roleKey="secondary"/>
            </div>
          )}
          <div style={{marginBottom:24}}>
            <p style={{color:theme.textSub,fontSize:12,textTransform:"uppercase",letterSpacing:1,marginBottom:12}}>Manual colour pickers</p>
            {[{label:"Primary accent",key:"primary"},{label:"Strong score (7–10)",key:"strong"},{label:"Developing score (4–6)",key:"developing"},{label:"Emerging score (1–3)",key:"secondary"}].map(({label,key})=>(
              <div key={key} style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
                <span style={{color:"#ccc",fontSize:14}}>{label}</span>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <span style={{color:theme.textMuted,fontSize:12}}>{theme[key]}</span>
                  <input type="color" value={theme[key]} onChange={e=>{ const val=e.target.value; if(key==="primary") onThemeChange({...theme,primary:val,primaryDark:darken(val,50)}); else onThemeChange({...theme,[key]:val}); }} style={{width:36,height:36,borderRadius:6,cursor:"pointer",padding:2,background:"none",border:"none"}}/>
                </div>
              </div>
            ))}
          </div>
          <button onClick={()=>onThemeChange(DEFAULT_THEME)} style={{width:"100%",padding:"10px",borderRadius:8,border:`1px solid ${theme.border}`,background:"none",color:theme.textMuted,cursor:"pointer",fontSize:14}}>
            Reset to Kraken defaults
          </button>
        </div>
      );
    }

    // ─── Single CSV Upload ────────────────────────────────────────────────────

    function SingleUpload({rows,setRows,fileName,setFileName,error,setError}) {
      const theme=useTheme();
      const [dragging,setDragging]=useState(false);
      const [clientName,setClientName]=useState("");
      const [editingClient,setEditingClient]=useState(false);

      const handleFile=(file)=>{
        if (!file) return;
        setFileName(file.name); setError("");
        const reader=new FileReader();
        reader.onload=(e)=>{ try { const parsed=parseCSV(e.target.result); if(parsed.length===0){setError("No data rows found.");} else setRows(parsed); } catch{setError("Failed to parse CSV.");} };
        reader.readAsText(file);
      };
      const onDrop=useCallback((e)=>{ e.preventDefault(); setDragging(false); handleFile(e.dataTransfer.files[0]); },[]);
      const sessions=[...new Set(rows.map(r=>r.session))];

      return rows.length===0 ? (
        <div onDragOver={e=>{e.preventDefault();setDragging(true);}} onDragLeave={()=>setDragging(false)} onDrop={onDrop}
          style={{border:`2px dashed ${dragging?theme.primary:theme.border}`,borderRadius:16,padding:"48px 32px",textAlign:"center",background:dragging?`${theme.primary}22`:theme.bgDeep,transition:"all 0.2s",marginBottom:24}}>
          <div style={{fontSize:48,marginBottom:16}}>📊</div>
          <h2 style={{marginBottom:8}}>Upload your CSV export</h2>
          <p style={{color:theme.textMuted,marginBottom:24,fontSize:14}}>Export from Google Forms, Typeform, or any questionnaire tool and drop it here</p>
          <label style={{background:`linear-gradient(135deg,${theme.primary},${theme.primaryDark})`,color:"#fff",padding:"12px 28px",borderRadius:8,cursor:"pointer",fontWeight:700,fontSize:15}}>
            Choose CSV file<input type="file" accept=".csv" onChange={e=>handleFile(e.target.files[0])} style={{display:"none"}}/>
          </label>
          {error&&<p style={{color:theme.secondary,marginTop:16}}>{error}</p>}
        </div>
      ) : (
        <>
          <div style={{display:"flex",gap:16,marginBottom:24,flexWrap:"wrap",alignItems:"center",justifyContent:"space-between"}}>
            <div style={{display:"flex",gap:12,flexWrap:"wrap",alignItems:"center"}}>
              {[{label:"Total responses",value:rows.length},{label:"Sessions covered",value:sessions.length}].map(({label,value})=>(
                <div key={label} style={{background:theme.bgCard,border:`1px solid ${theme.border}`,borderRadius:8,padding:"8px 16px"}}>
                  <div style={{color:theme.textMuted,fontSize:12}}>{label}</div>
                  <div style={{color:theme.primary,fontWeight:800,fontSize:22}}>{value}</div>
                </div>
              ))}
              <div style={{background:theme.bgCard,border:`1px solid ${theme.border}`,borderRadius:8,padding:"8px 16px"}}>
                <div style={{color:theme.textMuted,fontSize:12}}>File</div>
                <div style={{color:"#fff",fontWeight:600,fontSize:14}}>{fileName}</div>
              </div>
              {/* Client name prompt */}
              <div style={{background:clientName?theme.bgCard:`${theme.secondary}18`,border:`1px solid ${clientName?theme.border:theme.secondary}`,borderRadius:8,padding:"8px 16px",display:"flex",alignItems:"center",gap:10}}>
                <div>
                  <div style={{color:theme.textMuted,fontSize:12}}>Client name</div>
                  {editingClient ? (
                    <input
                      type="text"
                      autoFocus
                      value={clientName}
                      onChange={e=>setClientName(e.target.value)}
                      onBlur={()=>setEditingClient(false)}
                      onKeyDown={e=>{ if(e.key==="Enter"||e.key==="Escape") setEditingClient(false); }}
                      placeholder="e.g. TTE UK"
                      style={{background:"none",border:"none",borderBottom:`1px solid ${theme.primary}`,color:"#fff",fontSize:14,fontWeight:600,outline:"none",width:140,padding:"2px 0"}}
                    />
                  ) : (
                    <div
                      onClick={()=>setEditingClient(true)}
                      style={{color:clientName?"#fff":theme.secondary,fontWeight:600,fontSize:14,cursor:"pointer",minWidth:120}}
                    >
                      {clientName||"⚠ Add client name"}
                    </div>
                  )}
                </div>
                {!editingClient&&<button onClick={()=>setEditingClient(true)} style={{background:"none",border:"none",color:theme.textMuted,cursor:"pointer",fontSize:13,padding:0}}>✎</button>}
              </div>
            </div>
            <label style={{background:theme.bgCard,border:`1px solid ${theme.border}`,color:theme.textSub,padding:"8px 16px",borderRadius:8,cursor:"pointer",fontSize:13}}>
              Upload new CSV<input type="file" accept=".csv" onChange={e=>{setRows([]);handleFile(e.target.files[0]);}} style={{display:"none"}}/>
            </label>
          </div>
          <AnalysisView rows={rows} clientName={clientName}/>
        </>
      );
    }

    // ─── Password gate ────────────────────────────────────────────────────────
    // Change the value below to set your password.
    const APP_PASSWORD = "ELDP manifesto";

    function PasswordGate({onUnlock}) {
      const [input,setInput]=useState("");
      const [shake,setShake]=useState(false);
      const [error,setError]=useState("");

      const attempt=()=>{
        if (input===APP_PASSWORD) { onUnlock(); }
        else {
          setError("Incorrect password. Please try again.");
          setShake(true);
          setInput("");
          setTimeout(()=>setShake(false),500);
        }
      };

      return (
        <div style={{minHeight:"100vh",background:"#0a0a1a",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"'Segoe UI',system-ui,sans-serif"}}>
          <div style={{
            background:"#12123a",border:"1px solid #2a2a5a",borderRadius:16,padding:"48px 40px",
            width:"100%",maxWidth:400,textAlign:"center",
            transform:shake?"translateX(0)":"none",
            animation:shake?"shake 0.4s ease":"none",
          }}>
            <div style={{width:56,height:56,background:"linear-gradient(135deg,#b026ff,#ff4d6d)",borderRadius:14,display:"flex",alignItems:"center",justifyContent:"center",fontSize:26,margin:"0 auto 20px"}}>✦</div>
            <h1 style={{color:"#fff",fontSize:20,fontWeight:800,marginBottom:6}}>TTE UK Leadership Analyser</h1>
            <p style={{color:"#888",fontSize:13,marginBottom:32}}>Kraken · Session Response Summary Tool</p>
            <input
              type="password"
              placeholder="Enter password"
              value={input}
              onChange={e=>{setInput(e.target.value);setError("");}}
              onKeyDown={e=>e.key==="Enter"&&attempt()}
              style={{width:"100%",padding:"12px 16px",borderRadius:8,border:`1px solid ${error?"#ff4d6d":"#2a2a5a"}`,background:"#0a0a1a",color:"#fff",fontSize:15,outline:"none",marginBottom:12,fontFamily:"inherit",textAlign:"center",letterSpacing:3}}
            />
            {error&&<p style={{color:"#ff4d6d",fontSize:13,marginBottom:12}}>{error}</p>}
            <button onClick={attempt} style={{width:"100%",padding:"12px",background:"linear-gradient(135deg,#b026ff,#8000cc)",border:"none",borderRadius:8,color:"#fff",fontSize:15,fontWeight:700,cursor:"pointer"}}>
              Enter
            </button>
          </div>
          <style>{`@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}`}</style>
        </div>
      );
    }

    // ─── Main App ─────────────────────────────────────────────────────────────

    function App() {
      const [unlocked,setUnlocked]=useState(false);
      const [mainTab,setMainTab]=useState("single");
      const [rows,setRows]=useState([]);
      const [fileName,setFileName]=useState("");
      const [error,setError]=useState("");
      const [cohorts,setCohorts]=useState([]);
      const [theme,setTheme]=useState(DEFAULT_THEME);
      const [showBranding,setShowBranding]=useState(false);

      if (!unlocked) return <PasswordGate onUnlock={()=>setUnlocked(true)}/>;

      return (
        <ThemeContext.Provider value={theme}>
          <div style={{minHeight:"100vh",background:theme.bgMain,fontFamily:"'Segoe UI',system-ui,sans-serif",color:"#fff"}}>

            {/* Header */}
            <div style={{background:`linear-gradient(135deg,${theme.bgCard},${darken(theme.bgMain,-10)})`,borderBottom:`1px solid ${theme.border}`,padding:"20px 32px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
              <div style={{display:"flex",alignItems:"center",gap:16}}>
                <div style={{width:40,height:40,background:`linear-gradient(135deg,${theme.primary},${theme.secondary})`,borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20}}>✦</div>
                <div>
                  <h1 style={{fontSize:20,fontWeight:800,letterSpacing:-0.5}}>TTE UK Leadership Analyser</h1>
                  <p style={{color:theme.textMuted,fontSize:13}}>Kraken · Session Response Summary Tool</p>
                </div>
              </div>
              <button onClick={()=>setShowBranding(v=>!v)} style={{background:showBranding?theme.primary:theme.bgDeep,border:`1px solid ${theme.border}`,color:showBranding?"#fff":theme.textSub,padding:"8px 14px",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:600}}>
                🎨 Branding
              </button>
            </div>

            {/* Top-level tabs */}
            <div style={{borderBottom:`1px solid ${theme.border}`,background:theme.bgCard,padding:"0 32px"}}>
              <div style={{display:"flex",gap:0,maxWidth:960,margin:"0 auto"}}>
                {[{id:"single",label:"Single CSV"},{id:"cohorts",label:`Multiple Cohorts${cohorts.length>0?` (${cohorts.length})`:""}`}].map(t=>(
                  <button key={t.id} onClick={()=>setMainTab(t.id)} style={{padding:"14px 24px",border:"none",borderBottom:`3px solid ${mainTab===t.id?theme.primary:"transparent"}`,background:"none",color:mainTab===t.id?theme.primary:theme.textMuted,cursor:"pointer",fontWeight:700,fontSize:14,transition:"all 0.2s"}}>
                    {t.label}
                  </button>
                ))}
              </div>
            </div>

            <div style={{maxWidth:960,margin:"0 auto",padding:"28px 24px"}}>
              {mainTab==="single"&&<SingleUpload rows={rows} setRows={setRows} fileName={fileName} setFileName={setFileName} error={error} setError={setError}/>}
              {mainTab==="cohorts"&&<CohortManager cohorts={cohorts} setCohorts={setCohorts}/>}
            </div>

            {showBranding&&(
              <>
                <div onClick={()=>setShowBranding(false)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:999}}/>
                <BrandingPanel theme={theme} onThemeChange={setTheme} onClose={()=>setShowBranding(false)}/>
              </>
            )}
          </div>
        </ThemeContext.Provider>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
